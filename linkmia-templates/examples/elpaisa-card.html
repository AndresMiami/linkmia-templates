<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Restaurant Name</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" id="theme-color" content="#FF6B35">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- SEO & Social -->
    <meta name="description" id="page-description" content="Order online, view menu, and connect with us">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #FF6B35;
            --secondary-color: #F7931E;
            --background-color: #1a1a1a;
            --card-background: #2a2a2a;
            --text-color: #ffffff;
            --text-muted: #888;
            --spacing: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Background overlay for readability */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
            opacity: 0;
            transition: opacity 0.3s;
        }

        body.has-bg-image::before {
            opacity: 1;
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ========================================
           LAYOUT: MINIMAL
           Small circular logo, centered content
        ======================================== */
        .layout-minimal .hero {
            text-align: center;
            padding: 40px 0 32px;
        }

        .layout-minimal .hero-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            border: 4px solid var(--primary-color);
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.3);
            display: block;
        }

        /* ========================================
           LAYOUT: HERO
           Large banner image at top
        ======================================== */
        .layout-hero {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .layout-hero .hero {
            position: relative;
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px 40px;
            background-size: cover;
            background-position: center;
        }

        .layout-hero .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.7));
            z-index: 0;
        }

        .layout-hero .hero > * {
            position: relative;
            z-index: 1;
        }

        .layout-hero .hero-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 4px solid white;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .layout-hero .container {
            flex: 1;
            padding-top: 0;
        }

        /* ========================================
           LAYOUT: CARD
           Centered card with shadow
        ======================================== */
        .layout-card {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .layout-card .container {
            background: var(--card-background);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 420px;
        }

        .layout-card .hero {
            text-align: center;
            margin-bottom: 32px;
        }

        .layout-card .hero-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            border: 3px solid var(--primary-color);
            display: block;
        }

        /* ========================================
           SHARED HERO STYLES
        ======================================== */
        .restaurant-name {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .layout-minimal .restaurant-name,
        .layout-card .restaurant-name {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .layout-hero .restaurant-name {
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .tagline {
            color: var(--text-muted);
            font-size: 16px;
            margin-bottom: 12px;
        }

        .layout-hero .tagline {
            color: rgba(255, 255, 255, 0.9);
        }

        .location {
            color: var(--text-muted);
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .layout-hero .location {
            color: rgba(255, 255, 255, 0.85);
        }

        /* ========================================
           BUTTON STYLES
        ======================================== */
        .button-grid {
            display: flex;
            flex-direction: column;
            gap: var(--spacing);
            margin-bottom: 32px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }

        .btn-secondary {
            background: var(--card-background);
            color: var(--text-color);
            border: 2px solid var(--primary-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 107, 53, 0.1);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.2);
        }

        .layout-card .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        /* ========================================
           SOCIAL LINKS
        ======================================== */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .social-link {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--card-background);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-color);
            transition: transform 0.2s, background 0.2s;
            border: 2px solid transparent;
        }

        .social-link:hover {
            transform: scale(1.1);
            border-color: var(--primary-color);
            background: rgba(255, 107, 53, 0.1);
        }

        .layout-card .social-link {
            background: rgba(255, 255, 255, 0.05);
        }

        .social-icon {
            width: 24px;
            height: 24px;
        }

        /* ========================================
           FOOTER
        ======================================== */
        .footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 32px;
        }

        .layout-hero .footer {
            color: rgba(255, 255, 255, 0.6);
        }

        .powered-by {
            margin-top: 8px;
            font-size: 11px;
        }

        .powered-by a {
            color: var(--primary-color);
            text-decoration: none;
        }

        /* ========================================
           SPACING VARIANTS
        ======================================== */
        .spacing-compact {
            --spacing: 12px;
        }

        .spacing-comfortable {
            --spacing: 16px;
        }

        .spacing-spacious {
            --spacing: 24px;
        }

        /* ========================================
           RESPONSIVE
        ======================================== */
        @media (max-width: 480px) {
            .restaurant-name {
                font-size: 28px;
            }
            
            .btn {
                font-size: 16px;
                padding: 16px 20px;
            }

            .layout-card .container {
                padding: 32px 24px;
            }
        }

        /* ========================================
           LOADING STATE
        ======================================== */
        .loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 9999;
        }

        .loading-spinner {
            border: 3px solid #333;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <p>Loading...</p>
    </div>

    <div class="hero" id="hero">
        <img id="hero-image" class="hero-image" src="" alt="Restaurant Logo">
        <h1 class="restaurant-name" id="restaurant-name"></h1>
        <p class="tagline" id="tagline"></p>
        <p class="location" id="location">
            <svg class="btn-icon" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
            </svg>
            <span id="location-text"></span>
        </p>
    </div>

    <div class="container" id="container">
        <!-- Button Grid -->
        <div class="button-grid" id="button-grid">
            <!-- Buttons will be dynamically generated here -->
        </div>

        <!-- Social Links -->
        <div class="social-links" id="social-links">
            <!-- Social icons will be dynamically generated here -->
        </div>

        <!-- Footer -->
        <div class="footer">
            <p id="hours"></p>
            <p class="powered-by">Powered by <a href="https://linkmia.com" target="_blank">LinkMia</a></p>
        </div>
    </div>

    <script>
        // ============================================
        // RESTAURANT CONFIGURATION
        // Edit this section for each restaurant
        // ============================================
        const RESTAURANT_CONFIG = {
            // Basic Information
            name: "El Paisa Tacos",
            tagline: "Authentic Mexican Street Food",
            location: "Miami, FL",
            hours: "Open Daily 11am - 10pm",
            
            // Layout & Design
            layout: {
                // Layout style: "minimal", "hero", or "card"
                style: "card",
                
                // Image configuration
                image: {
                    // For "minimal" and "card": small circular logo
                    // For "hero": can be logo or will use background image
                    url: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=400&h=400&fit=crop",
                    // For hero layout: background image
                    heroBackground: ""
                },
                
                // Background configuration
                background: {
                    type: "image",  // "color" or "image"
                    value: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=1200&h=800&fit=crop&q=80",
                    // If type is "image", set blur amount (0-10)
                    blur: 8
                },
                
                // Color scheme
                colors: {
                    primary: "#FF6B35",
                    secondary: "#F7931E",
                    text: "#ffffff",
                    textMuted: "#888888",
                    cardBackground: "#2a2a2a"
                },
                
                // Button spacing: "compact", "comfortable", "spacious"
                spacing: "comfortable"
            },
            
            // Action Buttons
            buttons: [
                {
                    text: "🛵 Order Delivery",
                    url: "https://order.doordash.com/store/el-paisa-tacos",
                    type: "primary"
                },
                {
                    text: "🥡 Order Pickup",
                    url: "https://order.doordash.com/store/el-paisa-tacos?service_type=pickup",
                    type: "primary"
                },
                {
                    text: "📍 Get Directions",
                    url: "https://maps.google.com/?q=El+Paisa+Tacos+Miami",
                    type: "secondary"
                },
                {
                    text: "📞 Call Us",
                    url: "tel:+13055551234",
                    type: "secondary"
                },
                {
                    text: "📖 View Menu",
                    url: "https://example.com/menu.pdf",
                    type: "secondary"
                }
            ],
            
            // Social Media Links
            social: {
                instagram: "https://instagram.com/elpaisatacos",
                facebook: "https://facebook.com/elpaisatacos",
                tiktok: "https://tiktok.com/@elpaisatacos"
            },
            
            // Analytics
            analytics: {
                enabled: true,
                trackClicks: true
            }
        };

        // ============================================
        // INITIALIZATION CODE
        // (No need to edit below this line)
        // ============================================

        document.addEventListener('DOMContentLoaded', () => {
            const config = RESTAURANT_CONFIG;
            
            // Apply layout style
            document.body.className = `layout-${config.layout.style} spacing-${config.layout.spacing}`;
            
            // Set CSS variables
            document.documentElement.style.setProperty('--primary-color', config.layout.colors.primary);
            document.documentElement.style.setProperty('--secondary-color', config.layout.colors.secondary);
            document.documentElement.style.setProperty('--text-color', config.layout.colors.text);
            document.documentElement.style.setProperty('--text-muted', config.layout.colors.textMuted);
            document.documentElement.style.setProperty('--card-background', config.layout.colors.cardBackground);
            
            // Set page metadata
            document.getElementById('page-title').textContent = config.name;
            document.getElementById('page-description').content = `${config.name} - ${config.tagline}`;
            document.getElementById('theme-color').content = config.layout.colors.primary;
            
            // Apply background
            if (config.layout.background.type === 'image') {
                document.body.style.backgroundImage = `url(${config.layout.background.value})`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundAttachment = 'fixed';
                document.body.classList.add('has-bg-image');
                
                if (config.layout.background.blur > 0) {
                    document.body.style.filter = `blur(${config.layout.background.blur}px)`;
                }
            } else {
                document.body.style.backgroundColor = config.layout.background.value;
            }
            
            // Apply hero background for hero layout
            if (config.layout.style === 'hero' && config.layout.image.heroBackground) {
                document.getElementById('hero').style.backgroundImage = `url(${config.layout.image.heroBackground})`;
            }
            
            // Set hero content
            document.getElementById('hero-image').src = config.layout.image.url;
            document.getElementById('hero-image').alt = `${config.name} Logo`;
            document.getElementById('restaurant-name').textContent = config.name;
            document.getElementById('tagline').textContent = config.tagline;
            document.getElementById('location-text').textContent = config.location;
            document.getElementById('hours').textContent = config.hours;
            
            // Generate buttons
            const buttonGrid = document.getElementById('button-grid');
            config.buttons.forEach((button) => {
                const btnElement = document.createElement('a');
                btnElement.href = button.url;
                btnElement.className = `btn btn-${button.type}`;
                btnElement.textContent = button.text;
                btnElement.target = '_blank';
                btnElement.rel = 'noopener';
                
                if (config.analytics.enabled && config.analytics.trackClicks) {
                    btnElement.addEventListener('click', () => {
                        trackClick(button.text, button.url);
                    });
                }
                
                buttonGrid.appendChild(btnElement);
            });
            
            // Generate social links
            const socialLinks = document.getElementById('social-links');
            if (config.social) {
                Object.entries(config.social).forEach(([platform, url]) => {
                    if (url) {
                        const link = document.createElement('a');
                        link.href = url;
                        link.className = 'social-link';
                        link.target = '_blank';
                        link.rel = 'noopener';
                        link.title = platform.charAt(0).toUpperCase() + platform.slice(1);
                        link.innerHTML = getSocialIcon(platform);
                        
                        if (config.analytics.enabled) {
                            link.addEventListener('click', () => {
                                trackClick(`Social: ${platform}`, url);
                            });
                        }
                        
                        socialLinks.appendChild(link);
                    }
                });
            }
            
            // Hide loading
            document.getElementById('loading').style.display = 'none';
        });

        function trackClick(buttonName, url) {
            console.log('Click tracked:', buttonName, url);
            // Integrate with your analytics here
        }

        function getSocialIcon(platform) {
            const icons = {
                instagram: '<svg class="social-icon" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>',
                facebook: '<svg class="social-icon" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>',
                tiktok: '<svg class="social-icon" fill="currentColor" viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>',
                twitter: '<svg class="social-icon" fill="currentColor" viewBox="0 0 24 24"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>',
                youtube: '<svg class="social-icon" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>'
            };
            return icons[platform] || '';
        }
    </script>
</body>
</html>
