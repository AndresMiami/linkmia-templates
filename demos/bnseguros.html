<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- DEMO / mock for client review: standalone copy of p/index.html. Not indexed. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">LinkMia</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" id="theme-color" content="#FF6B35">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- SEO & Social -->
    <meta name="description" id="page-description" content="Connect with us">
    <meta property="og:title" id="og-title" content="LinkMia">
    <meta property="og:description" id="og-description" content="Connect with us">
    <meta property="og:image" id="og-image" content="">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #FF6B35;
            --secondary-color: #F7931E;
            --background-color: #1a1a1a;
            --card-background: #2a2a2a;
            --text-color: #ffffff;
            --text-muted: #888;
            --spacing: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none; /* decorative overlay; card layout sits under it */
        }

        body.has-bg-image::before {
            opacity: 1;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
        }

        /* LAYOUT: MINIMAL */
        .layout-minimal .hero {
            text-align: center;
            padding: 40px 0 32px;
        }

        .layout-minimal .hero-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            border: 4px solid var(--primary-color);
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.3);
            display: block;
        }

        /* LAYOUT: HERO */
        .layout-hero {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .layout-hero .hero {
            position: relative;
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px 40px;
            background-size: cover;
            background-position: center;
        }

        .layout-hero .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.7));
            z-index: 0;
        }

        .layout-hero .hero > * {
            position: relative;
            z-index: 1;
        }

        .layout-hero .hero-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 4px solid white;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .layout-hero .container {
            flex: 1;
            padding-top: 0;
        }

        /* LAYOUT: CARD */
        .layout-card {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .layout-card .card-wrapper {
            background: var(--card-background);
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .layout-card .hero {
            text-align: center;
            padding-bottom: 24px;
        }

        .layout-card .hero-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 16px;
            border: 4px solid var(--primary-color);
        }

        /* Typography */
        .restaurant-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 12px;
        }

        .location {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .location svg {
            width: 16px;
            height: 16px;
        }

        /* Buttons */
        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-emoji {
            font-size: 1.1em;
        }

        /* Button Fill Styles */
        .btn-filled, .btn-primary {
            background: var(--primary-color);
            color: var(--on-primary-color, white);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-soft {
            background: rgba(255, 107, 53, 0.15);
            color: var(--primary-color);
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary {
            background: var(--card-background);
            color: var(--text-color);
            border: 1px solid #444;
        }

        /* Button Shapes */
        .btn-shape-square {
            border-radius: 0;
        }

        .btn-shape-default {
            border-radius: 12px;
        }

        .btn-shape-rounded {
            border-radius: 50px;
        }

        /* Button Shadow */
        .btn-shadow {
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        /* Hover states */
        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-filled:hover, .btn-primary:hover {
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.4);
        }

        .btn-outline:hover {
            background: var(--primary-color);
            color: var(--on-primary-color, white);
        }

        .btn-secondary:hover {
            border-color: var(--primary-color);
        }

        /* Spacing variants */
        .spacing-compact .button-grid { gap: 8px; }
        .spacing-compact .btn { padding: 12px 20px; }
        .spacing-spacious .button-grid { gap: 16px; }
        .spacing-spacious .btn { padding: 20px 28px; }

        /* Social Links */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .social-link {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-background);
            border-radius: 50%;
            color: var(--text-color);
            transition: all 0.2s;
        }

        .social-link:hover {
            background: var(--primary-color);
            color: var(--on-primary-color, white);
            transform: scale(1.1);
        }

        .social-icon {
            width: 20px;
            height: 20px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding-top: 16px;
            border-top: 1px solid #333;
        }

        .footer p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .powered-by a {
            color: var(--primary-color);
            text-decoration: none;
        }

        /* Loading */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--background-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-spinner {
            border: 3px solid #333;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Error State */
        .error-state {
            text-align: center;
            padding: 60px 20px;
        }

        .error-state h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .error-state p {
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .error-state a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .hidden {
            display: none !important;
        }

        /* Bio Text */
        .bio {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* Button Entrance Animations */
        .btn.anim-fade {
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }

        .btn.anim-slide {
            animation: slideUp 0.4s ease forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .btn.anim-scale {
            animation: scaleIn 0.3s ease forwards;
            opacity: 0;
            transform: scale(0.8);
        }

        .btn.anim-bounce {
            animation: bounceIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Button Hover Animations */
        .btn.hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.3);
        }

        .btn.hover-glow:hover {
            box-shadow: 0 0 20px var(--primary-color), 0 0 40px rgba(255, 107, 53, 0.3);
        }

        .btn.hover-pulse:hover {
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        /* ============================================
           THEME: "app" - the LinkMia booking-flow look
           (AirportMVP css/style.css design system) in the page's OWN colours.
           Opt-in via layout.theme = "app"; everything is scoped to .theme-app.
           ============================================ */
        .theme-app {
            --line: rgba(255, 255, 255, 0.12);             /* every outline and divider */
            --surface-control: rgba(255, 255, 255, 0.04);  /* every tappable box */
            --selected-bg: rgba(var(--primary-rgb), 0.12); /* brand tint */
            --r-control: 12px;
            --r-card: 16px;
            --card-pad-x: 20px;
            --page-pad: 24px;
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.5);
            --glow: 0 4px 12px rgba(var(--primary-rgb), 0.3);
            --ease: 0.2s ease;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        @media (max-width: 480px) { .theme-app { --page-pad: 16px; } }

        .theme-app .app-page {
            max-width: 576px;
            margin: 0 auto;
            padding: var(--page-pad);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            gap: var(--page-pad);
        }

        .theme-app .app-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.10) 100%), var(--card-background);
            border-radius: var(--r-card);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            animation: appFadeIn 0.3s ease both;
        }

        /* header row: like the booking card's progress row */
        .theme-app .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 12px var(--card-pad-x);
            border-bottom: 1px solid var(--line);
            min-height: 60px;
        }

        .theme-app .app-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border: 1px solid var(--line);
            border-radius: 9999px;
            background: var(--surface-control);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
        }
        .theme-app .app-pill svg { width: 14px; height: 14px; flex: none; }

        .theme-app .app-social { display: flex; gap: 8px; }
        .theme-app .app-social a {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--line);
            background: var(--surface-control);
            color: var(--text-color);
            transition: all var(--ease);
        }
        .theme-app .app-social a:hover { border-color: var(--primary-color); color: var(--primary-color); }
        .theme-app .app-social .social-icon { width: 18px; height: 18px; }

        .theme-app .app-body { padding: 24px var(--card-pad-x); }

        /* identity */
        .theme-app .app-identity { text-align: center; margin-bottom: 24px; }
        .theme-app .app-avatar {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.18);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
            overflow: hidden;
        }
        .theme-app .app-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .theme-app .app-name {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.2;
            color: var(--text-color);
            margin-bottom: 4px;
        }
        .theme-app .app-tagline { font-size: 15px; color: var(--text-muted); }

        /* section label: like "SELECT AIRPORT" */
        .theme-app .app-label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        /* primary actions: like "Start your journey" / "Continue" */
        .theme-app .app-actions { display: flex; flex-direction: column; gap: 12px; }
        .theme-app .app-cta {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 56px;
            padding: 10px 16px 10px 10px;
            border-radius: var(--r-control);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0) 55%, rgba(0, 0, 0, 0.08) 100%), var(--primary-color);
            box-shadow: var(--glow);
            color: var(--on-primary-color, #fff);
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: transform var(--ease), box-shadow var(--ease);
        }
        .theme-app .app-cta:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(var(--primary-rgb), 0.4); }
        .theme-app .app-cta:active { transform: scale(0.98); }
        .theme-app .app-cta-icon {
            width: 36px;
            height: 36px;
            flex: none;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.10);
            font-size: 20px;
        }
        .theme-app .app-cta-text { flex: 1; line-height: 1.25; }
        .theme-app .app-chevron { width: 18px; height: 18px; flex: none; opacity: 0.8; }

        /* secondary actions: like the mode / airport tappable boxes */
        .theme-app .app-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }
        .theme-app .app-option:last-child:nth-child(odd) { grid-column: 1 / -1; }
        .theme-app .app-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-height: 76px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: var(--r-control);
            background: var(--surface-control);
            color: var(--text-color);
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            line-height: 1.25;
            transition: all var(--ease);
        }
        .theme-app .app-option-icon { font-size: 22px; }
        .theme-app .app-option:hover {
            border-color: rgba(var(--primary-rgb), 0.5);
            background: rgba(var(--primary-rgb), 0.08);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(var(--primary-rgb), 0.15);
        }
        .theme-app .app-option:active { transform: scale(0.98); }

        .theme-app .app-cta:focus-visible,
        .theme-app .app-option:focus-visible,
        .theme-app .app-social a:focus-visible,
        .theme-app .app-pill:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }

        /* hours: like the summary rows (muted label, white value) */
        .theme-app .app-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
        }
        .theme-app .app-rows { display: flex; flex-direction: column; gap: 6px; }
        .theme-app .app-row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
        .theme-app .app-row-label { color: var(--text-muted); }
        .theme-app .app-row-value { color: var(--text-color); font-weight: 500; text-align: right; }

        .theme-app .app-footer { display: flex; justify-content: center; margin-top: auto; }
        .theme-app .app-footer a { color: var(--primary-color); text-decoration: none; font-weight: 600; }

        /* logo in the circle: contain so wide logos are not cropped */
        .theme-app .app-avatar img { object-fit: contain; padding: 8px; }

        /* CTA as a form toggle: chevron turns down while its form is open */
        .theme-app button.app-cta {
            width: 100%;
            border: none;
            font-family: inherit;
            text-align: left;
            cursor: pointer;
        }
        .theme-app .app-cta .app-chevron { transition: transform var(--ease); }
        .theme-app .app-cta[aria-expanded="true"] .app-chevron { transform: rotate(90deg); }

        /* inline lead form: a panel in the card, like the booking stages */
        .theme-app .lead-panel {
            margin-top: 12px;
            padding: 20px 16px;
            border: 1px solid var(--line);
            border-radius: var(--r-control);
            background: rgba(0, 0, 0, 0.14);
            animation: appFadeIn 0.25s ease both;
            scroll-margin-top: 16px;
        }
        .theme-app .lead-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 16px;
        }
        .theme-app .lead-title { font-size: 17px; font-weight: 600; color: var(--text-color); outline: none; }
        .theme-app .lead-close {
            flex: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: var(--surface-control);
            color: var(--text-muted);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
        }
        .theme-app .lead-form { display: flex; flex-direction: column; gap: 14px; }
        .theme-app .lead-field { display: flex; flex-direction: column; gap: 6px; }
        .theme-app .lead-label { font-size: 14px; font-weight: 600; color: var(--text-color); }
        .theme-app .lead-label .opt { font-weight: 400; color: var(--text-muted); }
        .theme-app .lead-label .req { color: var(--primary-color); margin-left: 2px; }
        .theme-app .lead-input {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: var(--r-control);
            background: var(--surface-control);
            color: var(--text-color);
            font-family: inherit;
            font-size: 16px;          /* 16px+ keeps iOS from zooming on focus */
            outline: none;
            transition: border-color var(--ease), background var(--ease);
            -webkit-appearance: none;
            appearance: none;
        }
        .theme-app .lead-input::placeholder { color: rgba(255, 255, 255, 0.35); }
        .theme-app .lead-input:focus { border-color: var(--primary-color); background: rgba(255, 255, 255, 0.07); }
        .theme-app .lead-input[aria-invalid="true"] { border-color: #FF453A; }
        .theme-app .lead-error { font-size: 13px; color: #FF8A80; min-height: 0; }
        .theme-app .lead-error:empty { display: none; }

        /* sí / no: the booking flow's two-up mode buttons */
        .theme-app .lead-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; border: none; }
        .theme-app .lead-choice legend { padding: 0; margin-bottom: 6px; }
        .theme-app .lead-choice input { position: absolute; opacity: 0; pointer-events: none; }
        .theme-app .lead-choice label {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            border: 1px solid var(--line);
            border-radius: var(--r-control);
            background: var(--surface-control);
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--ease);
        }
        .theme-app .lead-choice input:checked + label {
            border-color: var(--primary-color);
            background: var(--selected-bg);
            color: var(--primary-color);
        }
        .theme-app .lead-choice input:focus-visible + label { outline: 2px solid var(--primary-color); outline-offset: 2px; }

        .theme-app .lead-submit { justify-content: center; margin-top: 4px; }
        .theme-app .lead-submit .app-cta-text { flex: none; }
        .theme-app .lead-note { font-size: 12px; color: var(--text-muted); text-align: center; }

        /* confirmation */
        .theme-app .lead-done { text-align: center; padding: 8px 0; }
        .theme-app .lead-check {
            width: 56px;

                if (!analytics[slug]) {
                    analytics[slug] = { views: 0, clicks: 0, lastVisit: null };

                analytics[slug].views = (analytics[slug].views || 0) + 1;
                analytics[slug].lastVisit = new Date().toISOString();

            }

        // ============================================
        // LOAD GOOGLE FONTS

        function loadFont(fontName) {
            if (!fontName || fontName === 'system') return;
            const link = document.createElement('link');
            link.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(' ', '+')}&display=swap`;
            link.rel = 'stylesheet';
            document.head.appendChild(link);
        }

        // ============================================
        // CONTRAST: dark text on light primary colors
        // ============================================
        // WCAG relative luminance of a #rgb/#rrggbb color; null if unparseable.
        function relativeLuminance(hex) {
            let h = String(hex || '').trim().replace(/^#/, '');
            if (h.length === 3) h = h.split('').map(c => c + c).join('');
            if (!/^[0-9a-f]{6}$/i.test(h)) return null;
            const [r, g, b] = [0, 2, 4].map(i => {
                const c = parseInt(h.slice(i, i + 2), 16) / 255;
                return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * r + 0.7152 * g + 0.0722 * b;
        }

        // Light backgrounds (e.g. yellow) get dark navy text; everything else stays white.
        function textColorOn(bg) {
            const lum = relativeLuminance(bg);
            return lum !== null && lum >= 0.5 ? '#1b2150' : '#ffffff';
        }

        // "#ffd200" -> "255, 210, 0" (for rgba() tints); null if unparseable.
        function hexToRgbTriplet(hex) {
            let h = String(hex || '').trim().replace(/^#/, '');
            if (h.length === 3) h = h.split('').map(c => c + c).join('');
            if (!/^[0-9a-f]{6}$/i.test(h)) return null;
            return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)).join(', ');
        }

        // "Best National Insurance" -> "BN" (stand-in when there is no logo)
        function initialsOf(name) {
            return String(name || '').split(/\s+/).filter(Boolean).slice(0, 2)
                .map(w => w[0].toUpperCase()).join('');
        }

        // ============================================

        const THIS_YEAR = new Date().getFullYear();
        const LEAD_FORMS = {

        // Returns an error message, or '' when the value is fine.
        function checkField(f, value) {
            if (!value) return f.required ? 'Este campo es obligatorio.' : '';
            if (f.validate === 'phone') {
                const digits = value.replace(/\D/g, '');
                if (digits.length < 10 || digits.length > 15) return 'Escribe un teléfono válido (10 dígitos).';
            }
            if (f.validate === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)) {
                return 'Escribe un email válido.';
            }
            if (f.validate === 'year') {
                const y = Number(value);
                if (!/^\d{4}$/.test(value) || y < f.min || y > f.max) return `Escribe un año entre ${f.min} y ${f.max}.`;
            }
            return '';
        }

        function composeLeadMessage(spec, values) {
            const rows = spec.lines(values)
                .filter(([, v]) => v && String(v).trim())
                .map(([k, v]) => `• ${k}: ${String(v).trim()}`);
            return [spec.intro, '', ...rows].join('\n');
        }

        function whatsappNumber(config) {
            return String(config.leadForms?.whatsapp || '').replace(/\D/g, '');
        }

        let openLead = null;   // { key, button }

        function closeLeadForm() {
            const panel = document.getElementById('lead-panel');
            if (panel) panel.remove();
            if (openLead) openLead.button.setAttribute('aria-expanded', 'false');
            openLead = null;
        }

        function toggleLeadForm(key, button, config) {
            const wasOpen = openLead && openLead.key === key;
            closeLeadForm();
            if (wasOpen) { button.focus(); return; }
            openLead = { key, button };
            button.setAttribute('aria-expanded', 'true');
            const panel = buildLeadPanel(key, config);
            document.getElementById('lead-slot').appendChild(panel);
            const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
            panel.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
            panel.querySelector('.lead-title').focus({ preventScroll: true });
            if (config.slug) trackClick(config.slug);
        }

        function el(tag, props, ...children) {
            const n = document.createElement(tag);
            Object.entries(props || {}).forEach(([k, v]) => {
                if (v === undefined || v === null || v === false) return;
                if (k === 'class') n.className = v;
                else if (k === 'text') n.textContent = v;
                else n.setAttribute(k, v === true ? '' : v);
            });
            children.forEach(c => c && n.appendChild(c));
            return n;
        }

        function buildLeadPanel(key, config) {
            const spec = LEAD_FORMS[key];
            const panel = el('section', { id: 'lead-panel', class: 'lead-panel', 'aria-labelledby': 'lead-title' });
            const close = el('button', { type: 'button', class: 'lead-close', 'aria-label': 'Cerrar formulario', text: '✕' });
            close.addEventListener('click', () => { const b = openLead && openLead.button; closeLeadForm(); if (b) b.focus(); });
            panel.appendChild(el('div', { class: 'lead-head' },
                el('h2', { id: 'lead-title', class: 'lead-title', tabindex: '-1', text: spec.title }), close));

            const form = el('form', { class: 'lead-form', novalidate: true });
            const inputs = {};
            spec.fields.forEach(f => {
                const id = `lead-${key}-${f.name}`;
                const labelKids = [document.createTextNode(f.label)];
                labelKids.push(f.required
                    ? el('span', { class: 'req', 'aria-hidden': 'true', text: '*' })
                    : el('span', { class: 'opt', text: ' (opcional)' }));
                if (f.kind === 'choice') {
                    const fs = el('fieldset', { class: 'lead-field lead-choice' });
                    const legend = el('legend', { class: 'lead-label' }, ...labelKids);
                    fs.appendChild(legend);
                    f.options.forEach((opt, i) => {
                        const oid = `${id}-${i}`;
                        fs.appendChild(el('input', { type: 'radio', id: oid, name: f.name, value: opt }));
                        fs.appendChild(el('label', { for: oid, text: opt }));
                    });
                    form.appendChild(fs);
                    return;
                }
                const err = el('p', { id: `${id}-err`, class: 'lead-error', 'aria-live': 'polite' });
                const input = el('input', {
                    id, name: f.name, class: 'lead-input',
                    type: f.type || 'text',
                    inputmode: f.inputmode, autocomplete: f.autocomplete,
                    placeholder: f.placeholder, maxlength: f.maxlength,
                    required: f.required, 'aria-required': f.required ? 'true' : null,
                    'aria-describedby': `${id}-err`,
                    enterkeyhint: 'next'
                });
                inputs[f.name] = { f, input, err };
                // after a failed submit, errors clear as soon as the value becomes valid
                input.addEventListener('input', () => {
                    if (input.getAttribute('aria-invalid') === 'true' && !checkField(f, input.value.trim())) {
                        input.removeAttribute('aria-invalid');
                        err.textContent = '';
                    }
                });
                input.addEventListener('blur', () => {
                    if (form.dataset.tried) {
                        const msg = checkField(f, input.value.trim());
                        err.textContent = msg;
                        msg ? input.setAttribute('aria-invalid', 'true') : input.removeAttribute('aria-invalid');
                    }
                });
                form.appendChild(el('div', { class: 'lead-field' },
                    el('label', { class: 'lead-label', for: id }, ...labelKids), input, err));
            });
            const last = Object.values(inputs).pop();
            if (last) last.input.setAttribute('enterkeyhint', 'send');

            const submit = el('button', { type: 'submit', class: 'app-cta lead-submit' },
                el('span', { class: 'app-cta-text', text: 'Enviar por WhatsApp' }));
            form.appendChild(submit);
            form.appendChild(el('p', { class: 'lead-note', text: 'Se abrirá WhatsApp con tus datos listos para enviar.' }));

            form.addEventListener('submit', e => {
                e.preventDefault();
                form.dataset.tried = '1';
                const values = {};
                let firstBad = null;
                Object.values(inputs).forEach(({ f, input, err }) => {
                    const v = input.value.trim();
                    values[f.name] = v;
                    const msg = checkField(f, v);
                    err.textContent = msg;
                    if (msg) {
                        input.setAttribute('aria-invalid', 'true');
                        if (!firstBad) firstBad = input;
                    } else {
                        input.removeAttribute('aria-invalid');
                    }
                });
                spec.fields.filter(f => f.kind === 'choice').forEach(f => {
                    const picked = form.querySelector(`input[name="${f.name}"]:checked`);
                    values[f.name] = picked ? picked.value : '';
                });
                if (firstBad) { firstBad.focus(); return; }

                const url = `https://wa.me/${whatsappNumber(config)}?text=${encodeURIComponent(composeLeadMessage(spec, values))}`;
                showLeadDone(panel, url);
                // Opening inside the submit tap keeps it a user gesture; if the
                // browser (e.g. an in-app browser) refuses the new tab, go there directly.
                // (No 'noopener' feature: with it window.open always returns null.)
                const win = window.open(url, '_blank');
                if (win) { try { win.opener = null; } catch (_) {} }
                else window.location.href = url;
            });

            panel.appendChild(form);
            return panel;
        }

        function showLeadDone(panel, url) {
            panel.replaceChildren();
            const check = el('div', { class: 'lead-check', 'aria-hidden': 'true' });
            check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
            const again = el('a', { class: 'app-cta lead-submit', href: url, target: '_blank', rel: 'noopener' },
                el('span', { class: 'app-cta-text', text: 'Abrir WhatsApp' }));
            const back = el('button', { type: 'button', class: 'lead-link', text: 'Volver' });
            back.addEventListener('click', () => { const b = openLead && openLead.button; closeLeadForm(); if (b) b.focus(); });
            const title = el('h2', { class: 'lead-done-title', tabindex: '-1', role: 'status', text: '¡Listo! Te estamos conectando por WhatsApp…' });
            panel.append(el('div', { class: 'lead-done' },
                check, title,
                el('p', { class: 'lead-done-text', text: 'Solo toca Enviar en WhatsApp. Si no se abrió, usa este botón:' }),
                again, el('br'), back));
            title.focus({ preventScroll: true });
        }

        function renderAppTheme(config) {
            document.body.className = 'theme-app';
            document.getElementById('content-app').classList.remove('hidden');
            const rgb = hexToRgbTriplet(config.layout?.colors?.primary) || '255, 107, 53';
            document.documentElement.style.setProperty('--primary-rgb', rgb);

            // header row
            const loc = config.location || '';
            document.getElementById('app-location-text').textContent = loc;
            if (!loc) document.getElementById('app-location').remove();
            renderSocial(config.social || {}, 'app-social');

            // identity: logo if there is one, otherwise initials
            const avatar = document.getElementById('app-avatar');
            const logo = config.layout?.image?.url;
            avatar.textContent = initialsOf(config.name);
            if (logo) {
                // Show initials until the logo loads; keep them if it never does.
                const img = new Image();
                img.alt = '';
                img.onload = () => { avatar.textContent = ''; avatar.appendChild(img); };
                img.src = logo;
            }
            document.getElementById('app-name').textContent = config.name;
            document.getElementById('app-tagline').textContent = config.tagline || '';

            // buttons: type "primary" -> gradient CTA, anything else -> tappable box
            const slug = config.slug;
            const actions = document.getElementById('app-actions');
            const options = document.getElementById('app-options');
            (config.buttons || []).forEach(button => {
                const primary = button.type === 'primary';
                const form = button.form && LEAD_FORMS[button.form] ? button.form : null;
                const a = document.createElement(form ? 'button' : 'a');
                if (form) {
                    a.type = 'button';
                    a.dataset.form = form;
                    a.setAttribute('aria-expanded', 'false');
                    a.setAttribute('aria-controls', 'lead-panel');
                    a.addEventListener('click', () => toggleLeadForm(form, a, config));
                } else {
                    a.href = button.url;
                    a.target = '_blank';
                    a.rel = 'noopener';
                }
                a.className = primary ? 'app-cta' : 'app-option';
                if (button.emoji) {
                    const icon = document.createElement('span');
                    icon.className = primary ? 'app-cta-icon' : 'app-option-icon';
                    icon.setAttribute('aria-hidden', 'true');
                    icon.textContent = button.emoji;
                    a.appendChild(icon);
                }
                const text = document.createElement('span');
                text.className = primary ? 'app-cta-text' : '';
                text.textContent = button.text;
                a.appendChild(text);
                if (primary) a.insertAdjacentHTML('beforeend', chevronSVG);
                a.addEventListener('click', () => { if (slug) trackClick(slug); });
                (primary ? actions : options).appendChild(a);
            });
            const slot = document.createElement('div');
            slot.id = 'lead-slot';
            actions.after(slot);
            if (!actions.children.length) actions.remove();
            if (!options.children.length) options.remove();

            // hours: "Lun–Vie 9am–6:30pm · Sáb 10am–2pm" -> label/value rows
            const hours = (config.hours || '').split('·').map(s => s.trim()).filter(Boolean);
            if (hours.length) {
                document.getElementById('app-hours-label').textContent = config.labels?.hours || 'Horario';
                const rows = document.getElementById('app-hours');
                hours.forEach(part => {
                    const cut = part.indexOf(' ');
                    const row = document.createElement('div');
                    row.className = 'app-row';
                    const label = document.createElement('span');
                    label.className = 'app-row-label';
                    const value = document.createElement('span');
                    value.className = 'app-row-value';
                    if (cut > 0) {
                        label.textContent = part.slice(0, cut);
                        value.textContent = part.slice(cut + 1);
                    } else {
                        value.textContent = part;
                    }
                    row.append(label, value);
                    rows.appendChild(row);
                });
            } else {
                document.getElementById('app-hours-section').remove();
            }

            document.getElementById('loading').style.display = 'none';
        }

        function setHeroImage(id, config) {
            const img = document.getElementById(id);
            const url = config.layout?.image?.url;
            if (!url) {
                img.remove();
                return;
            }
            img.src = url;
            img.alt = `${config.name} Logo`;
        }

        // ============================================
        // RENDER PAGE
        // ============================================
        function renderPage(config) {
            const isCard = config.layout?.style === 'card';

            // Load custom font
            const font = config.layout?.font;
            if (font && font !== 'system') {
                loadFont(font);
                document.body.style.fontFamily = `'${font}', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif`;
            }

            // Set CSS variables
            document.documentElement.style.setProperty('--primary-color', config.layout?.colors?.primary || '#FF6B35');
            document.documentElement.style.setProperty('--on-primary-color', textColorOn(config.layout?.colors?.primary || '#FF6B35'));
            document.documentElement.style.setProperty('--secondary-color', config.layout?.colors?.secondary || '#F7931E');
            document.documentElement.style.setProperty('--text-color', config.layout?.colors?.text || '#ffffff');
            document.documentElement.style.setProperty('--text-muted', config.layout?.colors?.textMuted || '#888888');
            document.documentElement.style.setProperty('--card-background', config.layout?.colors?.cardBackground || '#2a2a2a');

            // Set page metadata
            document.getElementById('page-title').textContent = config.name;
            document.getElementById('page-description').content = `${config.name} - ${config.tagline || 'Connect with us'}`;
            document.getElementById('theme-color').content = config.layout?.colors?.primary || '#FF6B35';
            document.getElementById('og-title').content = config.name;
            document.getElementById('og-description').content = config.tagline || 'Connect with us';
            if (config.layout?.image?.url) {
                document.getElementById('og-image').content = config.layout.image.url;
            }

            // Apply background based on type
            const bgType = config.layout?.background?.type || 'color';
            const bgValue = config.layout?.background?.value || '#1a1a1a';

            if (bgType === 'gradient') {
                document.body.style.background = bgValue;
            } else if (bgType === 'image' && bgValue) {
                const overlay = config.layout?.background?.overlay || 50;
                document.body.style.background = `linear-gradient(rgba(0,0,0,${overlay/100}), rgba(0,0,0,${overlay/100})), url(${bgValue}) center/cover no-repeat fixed`;
                document.body.classList.add('has-bg-image');
            } else {
                document.body.style.backgroundColor = bgValue;
            }

            if (config.layout?.theme === 'app') {
                renderAppTheme(config);
                return;
            }

            if (isCard) {
                // Card Layout
                document.body.classList.add('layout-card');
                document.getElementById('content-card').classList.remove('hidden');

                setHeroImage('card-hero-image', config);
                document.getElementById('card-restaurant-name').textContent = config.name;
                document.getElementById('card-tagline').textContent = config.tagline || '';
                document.getElementById('card-bio').textContent = config.bio || '';
                document.getElementById('card-location-text').textContent = config.location || '';
                document.getElementById('card-hours').textContent = config.hours || '';

                renderButtons(config.buttons || [], 'card-button-grid', config);
                renderSocial(config.social || {}, 'card-social-links');
            } else {
                // Minimal or Hero Layout
                document.body.className = `layout-${config.layout?.style || 'minimal'} spacing-${config.layout?.spacing || 'comfortable'}`;
                document.getElementById('content-default').classList.remove('hidden');

                // Hero background for hero layout
                if (config.layout?.style === 'hero' && config.layout?.image?.heroBackground) {
                    document.getElementById('hero').style.backgroundImage = `url(${config.layout.image.heroBackground})`;
                }

                setHeroImage('hero-image', config);
                document.getElementById('restaurant-name').textContent = config.name;
                document.getElementById('tagline').textContent = config.tagline || '';
                document.getElementById('bio').textContent = config.bio || '';
                document.getElementById('location-text').textContent = config.location || '';
                document.getElementById('hours').textContent = config.hours || '';

                renderButtons(config.buttons || [], 'button-grid', config);
                renderSocial(config.social || {}, 'social-links');
            }

            // Hide loading
            document.getElementById('loading').style.display = 'none';
        }

        function renderButtons(buttons, containerId, config) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const buttonStyle = config?.layout?.buttonStyle || 'filled';
            const buttonShape = config?.layout?.buttonShape || 'default';
            const buttonShadow = config?.layout?.buttonShadow || false;
            const entranceAnim = config?.layout?.animation?.entrance || 'none';
            const hoverAnim = config?.layout?.animation?.hover || 'none';
            const slug = config?.slug;

            buttons.forEach((button, index) => {
                const btn = document.createElement('a');
                btn.href = button.url;

                // Build class list
                const classes = ['btn', `btn-${buttonStyle}`, `btn-shape-${buttonShape}`];
                if (buttonShadow) classes.push('btn-shadow');
                if (entranceAnim !== 'none') classes.push(`anim-${entranceAnim}`);
                if (hoverAnim !== 'none') classes.push(`hover-${hoverAnim}`);
                btn.className = classes.join(' ');

                // Add animation delay for staggered entrance
                if (entranceAnim !== 'none') {
                    btn.style.animationDelay = `${index * 0.1}s`;
                }

                // Add emoji if present
                if (button.emoji) {
                    const emojiSpan = document.createElement('span');
                    emojiSpan.className = 'btn-emoji';
                    emojiSpan.textContent = button.emoji;
                    btn.appendChild(emojiSpan);
                }

                // Add text
                const textSpan = document.createElement('span');
                textSpan.textContent = button.text;
                btn.appendChild(textSpan);

                btn.target = '_blank';
                btn.rel = 'noopener';

                // Track clicks (cookie-free)
                btn.addEventListener('click', () => {
                    if (slug) trackClick(slug);
                });

                container.appendChild(btn);
            });
        }

        function renderSocial(social, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            Object.entries(social).forEach(([platform, url]) => {
                if (url && socialIcons[platform]) {
                    const link = document.createElement('a');
                    link.href = url;
                    link.className = 'social-link';
                    link.target = '_blank';
                    link.rel = 'noopener';
                    link.title = platform.charAt(0).toUpperCase() + platform.slice(1);
                    link.innerHTML = socialIcons[platform];
                    container.appendChild(link);
                }
            });
        }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-state').classList.remove('hidden');
        }

        function init() {
            try {
                trackPageView(DEMO_PAGE.slug);
                renderPage(DEMO_PAGE);

                console.error('Error rendering demo:', error);
                showError();

        // Start
        init();
    </script>
