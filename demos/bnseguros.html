        }

        function openQuoteFlow(kind, opener) {
            if (QF && QF.open) return;
            const draft = loadDraft(kind);
            if (draft && draft.sent) clearDraft(kind);   // a sent quote starts fresh next time
            openFlowUI(kind, opener);
            go('intro');
        }

        // Back to the page: unwind this flow's history entries (popstate closes the layer).
        function closeFlow() {
            if (!QF || !QF.open) return;
            if (activeSheet) activeSheet.close({ fromHistory: true, noFocus: true });
            if (QF.sent) clearDraft(QF.kind);
            if (H.ok && QF.st) {
                const q = QF;
                history.go(-QF.st.i);
                setTimeout(() => { if (q.open) closeFlowUI(); }, 700);   // if the browser ignores go()
            } else {
                closeFlowUI();
            }
        }

        function closeFlowUI() {
            if (!QF || !QF.open) return;
            if (activeSheet) activeSheet.close({ fromHistory: true, noFocus: true });
            QF.open = false;
            QF.ctl = null;
            popModal(QF.els.root);
            QF.els.root.remove();
            if (QF.opener && QF.opener.isConnected) QF.opener.focus({ preventScroll: true });
        }

        function restoreFlowFromHistory() {       // reload mid-quote: reopen where it was
            if (!H.ok) return;
            const st = history.state;
            if (!st || !st.bnq || !QUOTE_FLOWS[st.bnq]) return;
            openFlowUI(st.bnq, null);
            QF.st = st;
            render('fwd');
            if (st.sheet) { waitForPop(); history.back(); }   // the picker that was open is gone
        }

        // ---- rendering ----
        function render(dir) {
            const { view } = QF.st;
            const step = QF.spec.steps.find(s => s.id === view) || null;
            QF.ctl = null;
            const out = view === 'summary' ? viewSummary()
                : view === 'done' ? viewDone()
                : step ? viewStep(step)
                : viewIntro();

            updateHeader();
            const { els } = QF;

            out.node.classList.add(dir === 'back' ? 'q-in-back' : 'q-in-fwd');
            els.scroll.replaceChildren(out.node);
            els.scroll.scrollTop = 0;
            els.root.classList.remove('is-scrolled');
            els.footInner.replaceChildren(...out.foot);
            els.foot.hidden = !out.foot.length;
            if (view === 'intro') introProgress();          // Empezar fills as the ZIP is typed
            if (QF.ctl) { refreshStep(); QF.ctl.ready = true; }
            saveDraft();
            requestAnimationFrame(() => {
                const t = document.getElementById('q-title');
                if (t) t.focus({ preventScroll: true });
            });
        }

        // Section name, "Paso X de N" and the bar. The count can change while a
        // question is open (e.g. Condo drops the roof question), so it's live.
        function updateHeader() {
            const { view } = QF.st;
            const steps = visibleSteps();
            const step = QF.spec.steps.find(s => s.id === view) || null;
            const total = steps.length + 1;
            const idx = view === 'summary' ? total : step ? steps.indexOf(step) + 1 : 0;
            const sec = step ? QF.spec.sections.find(s => s.id === step.section) : null;
            const { els } = QF;
            els.section.textContent = view === 'summary' ? 'Revisión' : view === 'done' ? 'Enviado' : sec ? sec.title : QF.spec.intro.eyebrow;
            els.count.textContent = idx ? `Paso ${idx} de ${total}` : '';
            els.progress.hidden = !idx;
            els.fill.style.width = idx ? `${(idx / total) * 100}%` : '0';
            els.progress.setAttribute('aria-valuemax', String(total));
            els.progress.setAttribute('aria-valuenow', String(idx));
            els.progress.setAttribute('aria-valuetext', idx ? `Paso ${idx} de ${total}` : '');
            els.back.classList.toggle('is-hidden', view === 'intro');
        }

        function titleEl(text) { return el('h2', { id: 'q-title', class: 'q-title', tabindex: '-1', text }); }
        function primaryButton(content, props) {
            const b = el('button', Object.assign({ type: 'button', class: 'q-primary' }, props || {}));
            (Array.isArray(content) ? content : [el('span', { text: content })]).forEach(c => b.appendChild(c));
            return b;
        }
        function altLink(text, onClick, withIcon) {
            const b = el('button', { type: 'button', class: 'q-alt' + (withIcon ? ' is-wa' : '') }, withIcon ? icon('whatsapp') : null, el('span', { text }));
            b.addEventListener('click', onClick);
            return b;
        }
        function helpButton(help) {
            const b = el('button', { type: 'button', class: 'q-help', 'aria-haspopup': 'dialog' }, icon('info'), el('span', { text: help.label }));
            b.addEventListener('click', () => openHelp(help));
            return b;
        }
        function contextChip(c) {
            return el('p', { class: 'q-context' }, icon(c.icon), el('span', { text: c.text }));
        }
        function brandMark() {
            const mark = el('span', { class: 'q-brand-mark', 'aria-hidden': 'true' });
            const logo = document.querySelector('#app-avatar img');
            if (logo) mark.appendChild(logo.cloneNode());
            else mark.textContent = initialsOf(PAGE ? PAGE.name : '');
            return mark;
        }

        // ---- ZIP first (auto): asked on the intro, shown as a pill on each question,
        //      prefilled in "Cuéntanos sobre ti" (same answer, so editing either updates both) ----
        function zipBox(id, value, onInput, onEnter) {
            const input = el('input', {
                id, class: 'q-input', type: 'text', inputmode: 'numeric', pattern: '[0-9]*', maxlength: 5,
                autocomplete: 'postal-code', placeholder: 'Ej. 33125', enterkeyhint: 'go', 'aria-describedby': `${id}-err`
            });
            input.value = value || '';
            input.addEventListener('input', () => {
                const t = input.value.replace(/\D/g, '').slice(0, 5);
                if (t !== input.value) input.value = t;
                onInput(t);
            });
            input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); onEnter(); } });
            const box = el('div', { class: 'q-zip-box' }, icon('locate'), input);
            const err = el('p', { id: `${id}-err`, class: 'q-error', 'aria-live': 'polite' });
            return { input, box, err };
        }
        function introZip() {
            const z = zipBox('q-intro-zip', QF.a.zip, v => {
                QF.a.zip = v;
                saveDraft();
                introProgress();
                if (!check.zip(v)) { z.err.textContent = ''; z.input.removeAttribute('aria-invalid'); }
            }, () => { const b = QF.els.footInner.querySelector('.q-primary'); if (b) b.click(); });
            QF.introZip = z;
            return el('div', { class: 'q-intro-zip' },
                el('label', { class: 'q-label', for: 'q-intro-zip', text: QF.spec.intro.zipLabel || '¿En qué ZIP se guarda el auto?' }), z.box, z.err);
        }
        function introProgress() {
            if (!QF.spec.intro.zip) return;
            const b = QF.els.footInner.querySelector('.q-primary');
            setProgress(b, Math.min((QF.a.zip || '').length, 5) / 5);
        }
        function introZipOk() {
            if (!QF.spec.intro.zip) return true;
            const msg = check.zip(QF.a.zip || '');
            if (!msg) return true;
            const z = QF.introZip;
            if (z) {
                z.err.textContent = 'Escribe tu ZIP de 5 dígitos para empezar.';
                z.input.setAttribute('aria-invalid', 'true');
                z.input.focus();
            }
            return false;
        }
        // The ZIP pill: tap it and it becomes the ZIP box, right there (Enter, ✓ or
        // tapping away saves; Escape or an incomplete ZIP puts the old one back).
        function zipPill() {
            const wrap = el('span', { class: 'q-zip-wrap' });
            function show() {
                const b = el('button', { type: 'button', class: 'q-zip-pill' },
                    icon('locate'), el('span', { class: 'q-zip-value', text: QF.a.zip }), icon('edit', { class: 'q-zip-edit' }));
                b.setAttribute('aria-label', `ZIP ${QF.a.zip}. Toca para cambiarlo`);
                b.addEventListener('click', edit);
                wrap.replaceChildren(b);
                return b;
            }
            function edit() {
                const input = el('input', {
                    class: 'q-zip-input', type: 'text', inputmode: 'numeric', pattern: '[0-9]*', maxlength: 5,
                    autocomplete: 'postal-code', enterkeyhint: 'done', 'aria-label': 'Tu ZIP'
                });
                input.value = QF.a.zip || '';
                const ok = el('button', { type: 'button', class: 'q-zip-ok', 'aria-label': 'Guardar ZIP' });
                ok.innerHTML = ICON.tick;
                const box = el('span', { class: 'q-zip-pill is-editing' }, icon('locate'), input, ok);
                let done = false;
                function finish(save, refocus) {
                    if (done) return;
                    const v = input.value;
                    if (save && check.zip(v)) {          // 4 digits and Enter: say so, stay open
                        box.classList.remove('is-invalid'); void box.offsetWidth; box.classList.add('is-invalid');
                        input.focus();
                        return;
                    }
                    done = true;
                    if (save && v !== QF.a.zip) { QF.a.zip = v; onAnswer(); }
                    const b = show();
                    if (refocus) b.focus();
                }
                input.addEventListener('input', () => {
                    const t = input.value.replace(/\D/g, '').slice(0, 5);
                    if (t !== input.value) input.value = t;
                    box.classList.remove('is-invalid');
                });
                input.addEventListener('keydown', e => {
                    if (e.key === 'Enter') { e.preventDefault(); finish(true, true); }
                    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false, true); }
                });
                input.addEventListener('blur', () => setTimeout(() => {
                    if (!done && document.activeElement !== input) finish(!check.zip(input.value), false);
                }, 0));
                ok.addEventListener('pointerdown', e => e.preventDefault());   // keep the keyboard up
                ok.addEventListener('click', () => finish(true, true));
                wrap.replaceChildren(box);
                input.focus();
                input.select();
            }
            show();
            return wrap;
        }

        // ---- address suggestions: Photon (OpenStreetMap, free, no key) as they
        //      type; picking one fills the address and its ZIP. Nothing blocks:
        //      with no answer the box is a plain text field. ----
        const ADDRESS_API = 'https://photon.komoot.io/api/';
        const ADDRESS_BIAS = { lat: 25.76, lon: -80.19 };       // Miami first
        const ADDRESS_BBOX = '-87.7,24.3,-79.8,31.1';           // Florida only: no Cancún or Lisbon in the list
        // what people type -> what OpenStreetMap stores ("5152 nw 5th st" -> "5152 Northwest 5th Street"),
        // because the search matches whole words, not abbreviations
        const QUERY_WORDS = {
            nw: 'Northwest', ne: 'Northeast', sw: 'Southwest', se: 'Southeast', n: 'North', s: 'South', e: 'East', w: 'West',
            st: 'Street', ave: 'Avenue', av: 'Avenue', ct: 'Court', rd: 'Road', dr: 'Drive', blvd: 'Boulevard', ln: 'Lane',
            pl: 'Place', ter: 'Terrace', terr: 'Terrace', pkwy: 'Parkway', cir: 'Circle', hwy: 'Highway', trl: 'Trail', cswy: 'Causeway'
        };
        function addressQuery(q) {
            return q.replace(/\s*(#|\b(apt|unit|ste|suite)\b).*$/i, '')       // the unit is not part of the street
                .split(/[\s,]+/).filter(Boolean)
                .map(w => QUERY_WORDS[w.toLowerCase().replace(/\.$/, '')] || w).join(' ');
        }
        const US_STATES = { Florida: 'FL', Georgia: 'GA', Alabama: 'AL', 'New York': 'NY', 'New Jersey': 'NJ', Texas: 'TX', California: 'CA', 'North Carolina': 'NC', 'South Carolina': 'SC' };
        // "Southwest 8th Street" -> "SW 8th St", the way Miami addresses are written (USPS style)
        const DIRS = { Northeast: 'NE', Northwest: 'NW', Southeast: 'SE', Southwest: 'SW', North: 'N', South: 'S', East: 'E', West: 'W' };
        const SUFFIXES = { Street: 'St', Avenue: 'Ave', Court: 'Ct', Road: 'Rd', Drive: 'Dr', Boulevard: 'Blvd', Lane: 'Ln', Place: 'Pl', Terrace: 'Ter', Parkway: 'Pkwy', Circle: 'Cir', Highway: 'Hwy', Trail: 'Trl', Square: 'Sq' };
        function uspsStreet(street) {
            return street
                .replace(/^(Northeast|Northwest|Southeast|Southwest|North|South|East|West)\s+(?=\S)/, (m, d) => `${DIRS[d]} `)
                .replace(/\s+(Street|Avenue|Court|Road|Drive|Boulevard|Lane|Place|Terrace|Parkway|Circle|Highway|Trail|Square)(?=(\s+(Northeast|Northwest|Southeast|Southwest|North|South|East|West))?$)/, (m, w) => ` ${SUFFIXES[w]}`)
                .replace(/\s+(Northeast|Northwest|Southeast|Southwest|North|South|East|West)$/, (m, d) => ` ${DIRS[d]}`);
        }
        function addressSuggest(input, r, f) {
            const listId = `${input.id}-list`;
            const list = el('ul', { id: listId, class: 'q-suggest', role: 'listbox', 'aria-label': 'Direcciones sugeridas', hidden: true });
            input.setAttribute('role', 'combobox');
            input.setAttribute('aria-autocomplete', 'list');
            input.setAttribute('aria-expanded', 'false');
            input.setAttribute('aria-controls', listId);
            input.setAttribute('autocomplete', 'off');               // one dropdown, not two
            let seq = 0, timer = null, items = [], active = -1, inflight = null, slow = null;
            const cache = new Map();                                // query -> suggestions (instant on backspace)

            function close() {
                list.hidden = true; items = []; active = -1;
                input.setAttribute('aria-expanded', 'false');
                input.removeAttribute('aria-activedescendant');
            }
            function setActive(k) {
                active = k;
                [...list.querySelectorAll('.q-suggest-opt')].forEach((li, j) => li.classList.toggle('is-active', j === k));
                if (k >= 0) input.setAttribute('aria-activedescendant', `${listId}-${k}`); else input.removeAttribute('aria-activedescendant');
            }
            function pick(it) {
                input.value = it.value;
                QF.a[f.name] = it.value;
                if (/^\d{5}$/.test(it.zip)) QF.a.zip = it.zip;       // the address they chose decides the ZIP
                close();
                r.setError('');
                onAnswer();
            }
            function render() {
                list.replaceChildren(...items.map((it, k) => {
                    const li = el('li', { id: `${listId}-${k}`, class: 'q-suggest-opt', role: 'option' }, icon('pin'),
                        el('span', {}, el('span', { class: 'q-suggest-main', text: it.main }), el('span', { class: 'q-suggest-sub', text: it.sub })));
                    li.addEventListener('pointerdown', e => e.preventDefault());   // keep focus in the box
                    li.addEventListener('click', () => pick(it));
                    return li;
                }), el('li', { class: 'q-suggest-credit', role: 'presentation', text: 'Direcciones © OpenStreetMap' }));
                list.hidden = !items.length;
                input.setAttribute('aria-expanded', String(!!items.length));
                setActive(-1);
                if (items.length) list.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
            }
            function loading() {                                    // a slow answer still shows life
                if (items.length) return;
                list.replaceChildren(el('li', { class: 'q-suggest-credit', role: 'presentation', text: 'Buscando direcciones…' }));
                list.hidden = false;
            }
            function parse(data, q) {
                const typedNumber = (/^\s*(\d+[a-z]?)\s/i.exec(q) || [])[1] || '';
                const seen = new Set();
                return (data && Array.isArray(data.features) ? data.features : []).map(ft => ft.properties || {})

            bundle.addEventListener('change', () => { a.bundle = bundle.checked; saveDraft(); });
            const mark = el('span', { class: 'q-mark', 'aria-hidden': 'true' });
            mark.innerHTML = ICON.tick;
            v.appendChild(el('div', { class: 'q-opt is-check q-bundle' }, bundle,
                el('label', { for: 'q-bundle' }, mark, el('span', { class: 'q-opt-text' },
                    el('span', { class: 'q-opt-label', text: spec.bundle.label }), el('span', { class: 'q-opt-desc', text: spec.bundle.desc })))));
            }

            const send = primaryButton([icon('whatsapp'), el('span', { text: 'Enviar por WhatsApp' })]);
            send.addEventListener('click', () => {
                const next = firstIncomplete();
                if (next) { QF.tried.add(next.id); go(next.id, { edit: 1 }); return; }
                sendQuote('full');
            });
            return { node: v, foot: [send, el('p', { class: 'q-foot-note', text: 'Se abrirá WhatsApp con tu información lista. Solo toca Enviar.' })] };
        }

        function summaryRow(label, value, stepId, missing) {
            const b = el('button', { type: 'button', class: 'q-row' + (missing ? ' is-missing' : ''), 'aria-label': `${label}: ${value}. Editar` },

        function sendQuote(mode) {
            if (QF.pendingPop) { QF.afterPop = () => sendQuote(mode); return; }
            const url = `https://wa.me/${whatsappNumber(PAGE)}?text=${encodeURIComponent(composeMessage(mode))}`;
            QF.sent = true;
            QF.sentUrl = url;
            go('done');
            // Opening inside the tap keeps it a user gesture; if the browser
            // (e.g. an in-app browser) refuses the new tab, go there directly.
            // (No 'noopener' feature: with it window.open always returns null.)
            const win = window.open(url, '_blank');
            if (win) { try { win.opener = null; } catch (_) { /* cross-origin already */ } }
            else window.location.href = url;
        }

        function viewDone() {
            const { spec, a } = QF;

            const home = altLink('Volver al inicio', () => {

                    el('span', { class: 'q-recap-value', text: cap(spec.product(a)) + (ctx ? ` · ${ctx.text}` : '') })));

        // ---- bottom sheets (pickers and help) ----
        function openSheet({ onClose, full } = {}) {
            let pushed = false;
            if (activeSheet) {                 // swap sheets: reuse the open one's history entry
                pushed = activeSheet.isPushed();
                activeSheet.close({ noFocus: true, fromHistory: true });
            }
            const opener = document.activeElement;
            const backdrop = el('div', { class: 'sheet-backdrop' });
            const sheet = el('div', { class: 'sheet' + (full ? ' is-full' : ''), role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'sheet-title' });
            const head = el('div', { class: 'sheet-head' });
            const body = el('div', { class: 'sheet-body' });
            sheet.append(head, body);
            backdrop.appendChild(sheet);
            const api = {};

            function close(opts = {}) {
                if (!backdrop.isConnected) return;
                backdrop.remove();
                popModal(backdrop);
                if (activeSheet === api) activeSheet = null;
                if (onClose) onClose();
                // the picker had its own history entry; drop it
                if (pushed && !opts.fromHistory && QF && QF.open) { waitForPop(); history.back(); }
                if (!opts.noFocus && opener && opener.isConnected) opener.focus({ preventScroll: true });
            }
            function setView(viewTitle, { back } = {}) {
                head.replaceChildren();
                head.classList.toggle('has-back', !!back);
                if (back) {
                    const b = el('button', { type: 'button', class: 'sheet-btn', 'aria-label': 'Atrás' });
                    b.innerHTML = ICON.back;
                    b.addEventListener('click', back);
                    head.appendChild(b);
                } else {
                    head.appendChild(el('span'));
                }
                head.appendChild(el('h2', { id: 'sheet-title', class: 'sheet-title', tabindex: '-1', text: viewTitle }));
                const x = el('button', { type: 'button', class: 'sheet-btn', 'aria-label': 'Cerrar' });
                x.innerHTML = ICON.close;
                x.addEventListener('click', () => close());
                head.appendChild(x);
                body.replaceChildren();
                body.scrollTop = 0;
                return body;
            }
            backdrop.addEventListener('click', e => { if (e.target === backdrop) close(); });
            document.body.appendChild(backdrop);
            pushModal(backdrop, () => close());
            if (!pushed && QF && QF.open && H.ok && QF.st) {       // phone Back closes the picker, not the question
                const st = Object.assign({}, QF.st, { i: QF.st.i + 1, sheet: true });
                try { history.pushState(st, ''); QF.st = st; pushed = true; } catch (_) { /* in-page only */ }
            }
            Object.assign(api, { setView, close, isPushed: () => pushed, focusTitle: () => { const t = sheet.querySelector('#sheet-title'); if (t) t.focus({ preventScroll: true }); } });
            activeSheet = api;
            return api;
        }

        function sheetRow(text, { selected, muted, onPick }) {
            const b = el('button', { type: 'button', class: 'sheet-row' + (selected ? ' is-selected' : '') + (muted ? ' muted' : '') },
                el('span', { text }));
            if (selected) { b.setAttribute('aria-current', 'true'); b.insertAdjacentHTML('beforeend', ICON.check); }
            b.addEventListener('click', onPick);
            return el('li', {}, b);
        }

        function openHelp(help) {
            const api = openSheet();
            const body = api.setView(help.title || help.label);
            const box = el('div', { class: 'sheet-text' });
            (help.paras || []).forEach(p => box.appendChild(el('p', { text: p })));
            if (help.items) {
                box.appendChild(el('ul', {}, ...help.items.map(([lead, text]) =>
                    el('li', {}, lead ? el('strong', { text: `${lead} ` }) : null, document.createTextNode(text)))));
            }
            const ok = primaryButton('Entendido');
            ok.addEventListener('click', () => api.close());
            body.append(box, ok);

        }

        // "Otro": typed fallback inside the sheet
        function otherView(api, title, fields, back, done) {
            const body = api.setView(title, { back });
            const wrap = el('form', { class: 'sheet-other', novalidate: true });
            const inputs = fields.map(f => {
                const id = 'sheet-other-' + f.name;
                const input = el('input', { id, class: 'q-input', value: f.value || '', placeholder: f.placeholder, autocomplete: 'off', autocapitalize: 'words', enterkeyhint: 'done' });
                wrap.append(el('label', { class: 'q-label', for: id, text: f.label }), input);
                return input;
            });
            const err = el('p', { class: 'q-error', 'aria-live': 'polite' });
            wrap.append(err, primaryButton('Listo', { type: 'submit' }));
            wrap.addEventListener('submit', e => {
                e.preventDefault();
                const vals = inputs.map(i => i.value.trim());
                if (vals.some(v => !v)) { err.textContent = 'Completa los campos.'; inputs[vals.findIndex(v => !v)].focus(); return; }
                done(vals);
            });
            body.appendChild(wrap);
            inputs[0].focus();
        }

        function openYearSheet({ title, min, max, unknown, current }, onPick) {
            const api = openSheet();
            const body = api.setView(title);
            const list = el('ul', { class: 'sheet-list' });
            const pick = y => { onPick(y); api.close(); };
            if (unknown) list.appendChild(sheetRow(unknown, { selected: current === 'unknown', muted: true, onPick: () => pick('unknown') }));
            for (let y = max; y >= min; y--) {
                const year = String(y);
                list.appendChild(sheetRow(year, { selected: year === current, onPick: () => pick(year) }));
            }
            body.appendChild(list);
            const sel = list.querySelector('.is-selected');
            if (sel) sel.scrollIntoView({ block: 'center' });
            api.focusTitle();
        }

        // ---- models for a make AND year, from NHTSA vPIC (free, no key), so an
        //      older or brand-new car is in the list. Passenger cars, trucks and
        //      SUVs/MPVs only (no motorcycles, trailers or buses). Cached per
        //      make+year; slow or failed answers fall back to the built-in list. ----
        const MODELS_TIMEOUT_MS = 4000;
        const MODEL_TYPES = ['Car', 'Truck', 'Multipurpose'];
        const NOT_A_CAR = /chassis|motor ?home|cutaway|stripped|glider|\bbus\b|trailer/i;
        const modelsCache = new Map();
        const normModel = m => String(m).toLowerCase().replace(/[^a-z0-9]/g, '');

        function modelsKey(make, year) { return `bn-models-v1:${make}|${year}`; }
        function fetchModels(make, year) {
            if (!/^\d{4}$/.test(year || '')) return Promise.resolve(null);
            const key = modelsKey(make, year);
            if (modelsCache.has(key)) return modelsCache.get(key);
            try {
                const saved = JSON.parse(sessionStorage.getItem(key) || 'null');
                if (Array.isArray(saved)) { const p = Promise.resolve(saved); modelsCache.set(key, p); return p; }
            } catch (_) { /* private mode */ }
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), MODELS_TIMEOUT_MS);
            const one = type => fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/GetModelsForMakeYear/make/${encodeURIComponent(make)}/modelyear/${year}/vehicletype/${type}?format=json`,
                { signal: ctrl.signal, credentials: 'omit', referrerPolicy: 'no-referrer' })
                .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
                .then(d => (Array.isArray(d && d.Results) ? d.Results : []));
            const p = Promise.all(MODEL_TYPES.map(one))
                .then(parts => {
                    // our spelling when we know the model; NHTSA's otherwise; one row each
                    const known = new Map((VEHICLES[make] || []).map(m => [normModel(m), m]));
                    const seen = new Map();
                    parts.flat().forEach(r => {
                        const name = String(r.Model_Name || '').trim();
                        if (!name || NOT_A_CAR.test(name)) return;
                        const k = normModel(name);
                        if (k && !seen.has(k)) seen.set(k, known.get(k) || name);
                    });
                    const list = [...seen.values()].sort((x, y) => x.localeCompare(y, 'es', { numeric: true, sensitivity: 'base' }));
                    try { sessionStorage.setItem(key, JSON.stringify(list)); } catch (_) { /* private mode */ }
                    return list;
                })
                .catch(() => { modelsCache.delete(key); return null; })   // the next visit may try again
                .finally(() => clearTimeout(timer));
            modelsCache.set(key, p);
            return p;
        }

        // Year -> make -> model in one sheet, like the CARFAX / State Farm pickers.
        function openVehicleSheet(start, onChange) {
            const a = QF.a;
            const api = openSheet({ full: true });    // one height for year, brand and model: no jumps
            const finish = (make, model) => { a.marca = make; a.modelo = model; onChange(); api.close(); };

            function yearView() {
                const body = api.setView('Año del vehículo');
                const list = el('ul', { class: 'sheet-list' });
                for (let y = THIS_YEAR + 1; y >= 1980; y--) {
                    const year = String(y);
                    list.appendChild(sheetRow(year, {
                        selected: a.anio === year,
                        onPick: () => {
                            a.anio = year;
                            onChange();
                            if (a.marca && a.modelo) api.close();
                            else if (a.marca && VEHICLES[a.marca]) modelsView(a.marca);
                            else makesView();
                        }
                    }));
                }
                body.appendChild(list);
                const sel = list.querySelector('.is-selected');
                if (sel) sel.scrollIntoView({ block: 'center' });
                api.focusTitle();
            }

            function makesView() {
                const body = api.setView('Marca', { back: start === 'year' ? yearView : null });
                const search = el('div', { class: 'sheet-search' });
                search.innerHTML = ICON.search;
                const input = el('input', { type: 'search', placeholder: 'Busca marca o modelo (ej. Civic)', 'aria-label': 'Buscar marca o modelo', autocomplete: 'off', enterkeyhint: 'search' });
                search.appendChild(input);
                const popularLabel = el('p', { class: 'sheet-section', text: 'Marcas populares' });
                const grid = el('div', { class: 'make-grid' });
                POPULAR_MAKES.forEach(make => {
                    const mark = el('span', { class: 'make-mono', 'aria-hidden': 'true', text: make[0] });
                    let visual = mark;
                    if (logoUrl(make)) {                 // the logo, or the initial if it can't load
                        const img = el('img', { src: logoUrl(make), alt: '', decoding: 'async' });
                        visual = el('span', { class: 'make-logo', 'aria-hidden': 'true' }, img);
                        img.addEventListener('error', () => visual.replaceWith(mark), { once: true });
                    }
                    const t = el('button', { type: 'button', class: 'make-tile' }, visual, el('span', { text: make }));
                    t.addEventListener('pointerdown', () => fetchModels(make, a.anio), { passive: true });
                    t.addEventListener('click', () => modelsView(make));
                    grid.appendChild(t);
                });
                const allLabel = el('p', { class: 'sheet-section', text: 'Todas las marcas' });
                const list = el('ul', { class: 'sheet-list' });
                // typing a model goes straight to it: "civic" -> Honda Civic, "f150" -> Ford F-150
                const modelsLabel = el('p', { class: 'sheet-section', text: 'Modelos' });
                const modelList = el('ul', { class: 'sheet-list' });
                const otherList = el('ul', { class: 'sheet-list' });
                const empty = el('p', { class: 'sheet-empty', text: 'No encontramos esa marca ni ese modelo. Puedes escribirlo en «Otra marca».' });
                function modelHits(needle) {
                    if (needle.length < 2) return [];
                    const hits = [];
                    Object.entries(VEHICLES).forEach(([make, models]) => {
                        const nm = normModel(make);
                        models.forEach(model => {
                            const both = normModel(make + model);
                            if (normModel(model).includes(needle) || (needle.length > nm.length && both.startsWith(needle))) hits.push([make, model]);
                        });
                    });
                    return hits.slice(0, 25);
                }
                function renderList(q) {
                    const needle = q.toLowerCase();
                    const makes = Object.keys(VEHICLES).filter(m => m.toLowerCase().includes(needle));
                    list.replaceChildren(...makes.map(make => sheetRow(make, { selected: a.marca === make, onPick: () => modelsView(make) })));
                    const hits = modelHits(normModel(q));
                    modelList.replaceChildren(...hits.map(([make, model]) => sheetRow(`${make} ${model}`, {
                        selected: a.marca === make && a.modelo === model, onPick: () => finish(make, model)
                    })));
                    otherList.replaceChildren(sheetRow('Otra marca', { muted: true, onPick: () => otherMake(q) }));
                    empty.style.display = makes.length || hits.length ? 'none' : '';
                    popularLabel.style.display = grid.style.display = needle ? 'none' : '';
                    allLabel.style.display = makes.length || !needle ? '' : 'none';
                    allLabel.textContent = needle ? 'Marcas' : 'Todas las marcas';
                    modelsLabel.style.display = hits.length ? '' : 'none';
                }
                input.addEventListener('input', () => { renderList(input.value.trim()); body.scrollTop = 0; });
                body.append(search, popularLabel, grid, allLabel, list, modelsLabel, modelList, empty, otherList);
                renderList('');
                api.focusTitle();
            }

            // Models: the year's real list from NHTSA (built-in list while it loads
            // fails), popular ones first, a search box when the list is long.
            let modelsToken = 0;
            function modelsView(make) {
                const token = ++modelsToken;
                const year = /^\d{4}$/.test(a.anio || '') ? a.anio : '';
                const body = api.setView(`Modelos ${make}`, { back: makesView });
                const builtIn = VEHICLES[make] || [];
                if (!year) {                      // no year yet: the built-in list
                    renderModels(null, false);
                    api.focusTitle();
                    return;
                }
                const pending = fetchModels(make, year);
                let settled = false;
                pending.then(() => { settled = true; });

                const skeleton = el('ul', { class: 'sheet-skeleton', 'aria-hidden': 'true' },
                    ...[46, 62, 38, 54, 44, 58, 36].map(w => { const li = el('li'); li.style.setProperty('--w', `${w}%`); return li; }));
                const loading = el('p', { class: 'sheet-section', role: 'status', text: `Buscando modelos ${year}…` });

                function renderModels(models, animate) {
                    const fromNhtsa = !!year;
                    if (token !== modelsToken || !body.isConnected) return;    // they moved on
                    const wrap = el('div', { class: animate ? 'sheet-fade-in' : '' });
                    const all = models && models.length ? models : builtIn;
                    const live = fromNhtsa && models && models.length;
                    const liveName = new Map(all.map(m => [normModel(m), m]));
                    const popular = live && all.length > 15
                        ? (POPULAR_MODELS[make] || []).map(m => liveName.get(normModel(m))).filter(Boolean) : [];
                    const row = model => sheetRow(model, { selected: a.marca === make && a.modelo === model, onPick: () => finish(make, model) });
                    const other = () => sheetRow('Otro modelo', {
                        muted: true,
                        onPick: () => otherView(api, `Otro modelo ${make}`, [{ name: 'modelo', label: 'Modelo', placeholder: 'Escribe el modelo' }],
                            () => modelsView(make), ([model]) => finish(make, model))
                    });

                    let input = null;
                    {                                     // always there, pinned while the list scrolls
                        const search = el('div', { class: 'sheet-search' });
                        search.innerHTML = ICON.search;
                        input = el('input', { type: 'search', placeholder: `Buscar modelo ${make}`, 'aria-label': `Buscar modelo ${make}`, autocomplete: 'off', enterkeyhint: 'search' });
                        search.appendChild(input);
                        wrap.appendChild(search);
                    }
                    const popLabel = el('p', { class: 'sheet-section', text: 'Populares' });
                    const popList = el('ul', { class: 'sheet-list' }, ...popular.map(row));
                    const allLabel = el('p', { class: 'sheet-section' });
                    const list = el('ul', { class: 'sheet-list' });
                    const empty = el('p', { class: 'sheet-empty', text: 'No encontramos ese modelo. Puedes escribirlo en «Otro modelo».' });
                    function fill(q) {
                        const needle = normModel(q);
                        const hits = needle ? all.filter(m => normModel(m).includes(needle)) : all;
                        list.replaceChildren(...hits.map(row), other());
                        const showPop = !needle && popular.length;
                        popLabel.hidden = popList.hidden = !showPop;
                        allLabel.replaceChildren(document.createTextNode(needle ? 'Resultados'
                            : live ? `Todos los modelos ${year}` : showPop ? 'Todos los modelos' : 'Modelos'));
                        if (!needle && live) allLabel.appendChild(el('span', { class: 'count', text: ` · ${all.length}` }));
                        empty.hidden = !!hits.length;
                    }
                    if (input) input.addEventListener('input', () => fill(input.value.trim()));
                    wrap.append(popLabel, popList, allLabel, empty, list);
                    fill('');
                    body.replaceChildren(wrap);
                    const sel = wrap.querySelector('.sheet-row.is-selected');
                    if (sel && !animate) sel.scrollIntoView({ block: 'center' });
                }

                // A cached list renders at once; otherwise the skeleton holds the
                // space for a moment (no flash when NHTSA is quick).
                setTimeout(() => {
                    if (settled || token !== modelsToken) return;
                    body.replaceChildren(loading, skeleton);
                }, 120);
                pending.then(models => renderModels(models, true));
                api.focusTitle();
            }

            function otherMake(prefill) {
                otherView(api, 'Otra marca', [
                    { name: 'marca', label: 'Marca', placeholder: 'Escribe la marca', value: prefill },
                    { name: 'modelo', label: 'Modelo', placeholder: 'Escribe el modelo' }
                ], makesView, ([make, model]) => finish(make, model));
            }

            if (start === 'year') yearView();
            else if (a.marca && VEHICLES[a.marca]) modelsView(a.marca);
            else makesView();
        }

        function renderAppTheme(config) {
            document.body.className = 'theme-app';
            document.getElementById('content-app').classList.remove('hidden');
            const rgb = hexToRgbTriplet(config.layout?.colors?.primary) || '255, 107, 53';
            document.documentElement.style.setProperty('--primary-rgb', rgb);
            document.documentElement.style.setProperty('--page-background', config.layout?.background?.value || '#1a1a1a');
            PAGE = config;

            // header row
            const loc = config.location || '';
            document.getElementById('app-location-text').textContent = loc;
            if (!loc) document.getElementById('app-location').remove();
            renderSocial(config.social || {}, 'app-social');

            // identity: logo if there is one, otherwise initials
            const avatar = document.getElementById('app-avatar');
            const logo = config.layout?.image?.url;
            avatar.textContent = initialsOf(config.name);
            if (logo) {
                // Reserve the large emblem space now (no jump when it loads).
                // Show initials until the logo loads; keep them if it never does.
                avatar.classList.add('has-logo');
                avatar.parentElement.classList.add('has-logo');
                const img = new Image();
                img.alt = '';
                img.onload = () => {
                    avatar.textContent = '';
                    avatar.appendChild(img);
                    avatar.style.setProperty('--logo-url', `url("${img.src}")`);
                    avatar.classList.add('is-loaded');
                };
                img.src = logo;
            }
            document.getElementById('app-name').textContent = config.name;
            document.getElementById('app-tagline').textContent = config.tagline || '';

            // buttons: type "primary" -> gradient CTA, anything else -> tappable box
            const slug = config.slug;
            const actions = document.getElementById('app-actions');
            const options = document.getElementById('app-options');
            (config.buttons || []).forEach(button => {
                const primary = button.type === 'primary';
                const flow = button.form && QUOTE_FLOWS[button.form] ? button.form : null;
                const a = document.createElement(flow ? 'button' : 'a');
                if (flow) {
                    a.type = 'button';
                    a.dataset.form = flow;
                    a.setAttribute('aria-haspopup', 'dialog');
                    a.addEventListener('click', () => openQuoteFlow(flow, a));
                } else {
                    a.href = button.url;
                    a.target = '_blank';
                    a.rel = 'noopener';
                }
                a.className = primary ? 'app-cta' : 'app-option';
                // icon: a rendered medallion (button.icon), a gold line icon for
                // call / website links, else the emoji
                const lineIcon = !primary && (/^tel:/i.test(button.url || '') ? 'call' : /^https?:/i.test(button.url || '') ? 'web' : '');
                if (button.icon || lineIcon || button.emoji) {
                    const icon = document.createElement('span');
                    icon.className = primary ? 'app-cta-icon' : 'app-option-icon';
                    icon.setAttribute('aria-hidden', 'true');
                    if (button.icon) {
                        const img = el('img', { src: button.icon, alt: '', decoding: 'async' });
                        img.addEventListener('error', () => { icon.textContent = button.emoji || ''; }, { once: true });
                        icon.appendChild(img);
                    } else if (lineIcon) icon.innerHTML = LINE_ICONS[lineIcon];
                    else icon.textContent = button.emoji;
                    a.appendChild(icon);
                }
                const text = document.createElement('span');
                text.className = primary ? 'app-cta-text' : '';
                // "Cotiza tu Seguro de Auto" -> small "Cotiza tu seguro de" over a big "Auto"
                const split = primary && /^(.+\sde)\s+(\S.*)$/i.exec(button.text || '');
                if (split) {
                    text.append(el('span', { class: 'app-cta-eyebrow', text: split[1].charAt(0) + split[1].slice(1).toLowerCase() }),
                        el('span', { class: 'app-cta-main', text: split[2] }));
                    text.setAttribute('aria-label', button.text);
                } else if (primary) text.appendChild(el('span', { class: 'app-cta-main', text: button.text }));
                else text.textContent = button.text;
                const textBox = primary ? text : el('span', { class: 'app-option-text' }, text);
                a.appendChild(textBox);
                if (!primary) {                          // say where it goes: the number, the site
                    let sub = '';
                    if (/^tel:/i.test(button.url || '')) {
                        let d = button.url.replace(/\D/g, '');
                        if (d.length === 11 && d[0] === '1') d = d.slice(1);
                        sub = d.length === 10 ? `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}` : button.url.slice(4);
                    } else if (/^https?:/i.test(button.url || '')) {
                        try { sub = new URL(button.url).hostname.replace(/^www\./, ''); } catch (_) { /* leave it out */ }
                    }
                    if (sub) textBox.appendChild(el('span', { class: 'app-option-sub', text: sub }));
                }
                if (primary) a.insertAdjacentHTML('beforeend', chevronSVG);
                a.addEventListener('click', () => { if (slug) trackClick(slug); });
                (primary ? actions : options).appendChild(a);
            });
            if (!actions.children.length) actions.remove();
            if (!options.children.length) options.remove();

            // hours: "Lun–Vie 9am–6:30pm · Sáb 10am–2pm" -> label/value rows
            const hours = (config.hours || '').split('·').map(s => s.trim()).filter(Boolean);
            if (hours.length) {
                document.getElementById('app-hours-label').textContent = config.labels?.hours || 'Horario';
                const rows = document.getElementById('app-hours');
                hours.forEach(part => {
                    const cut = part.indexOf(' ');
                    const row = document.createElement('div');
                    row.className = 'app-row';
                    const label = document.createElement('span');
                    label.className = 'app-row-label';
                    const value = document.createElement('span');
                    value.className = 'app-row-value';
                    if (cut > 0) {
                        label.textContent = part.slice(0, cut);
                        value.textContent = part.slice(cut + 1);
                    } else {
                        value.textContent = part;
                    }
                    row.append(label, value);
                    rows.appendChild(row);
                });
            } else {
                document.getElementById('app-hours-section').remove();
            }

            document.getElementById('loading').style.display = 'none';
            restoreFlowFromHistory();
        }

        function setHeroImage(id, config) {
            const img = document.getElementById(id);
            const url = config.layout?.image?.url;
            if (!url) {
                img.remove();
                return;
            }
            img.src = url;
            img.alt = `${config.name} Logo`;
        }

        // ============================================
        // RENDER PAGE
        // ============================================
        function renderPage(config) {
            const isCard = config.layout?.style === 'card';

            // Load custom font
            const font = config.layout?.font;
            if (font && font !== 'system') {
                loadFont(font);
                document.body.style.fontFamily = `'${font}', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif`;
            }

            // Set CSS variables
            document.documentElement.style.setProperty('--primary-color', config.layout?.colors?.primary || '#FF6B35');
            document.documentElement.style.setProperty('--on-primary-color', textColorOn(config.layout?.colors?.primary || '#FF6B35'));
            document.documentElement.style.setProperty('--secondary-color', config.layout?.colors?.secondary || '#F7931E');
            document.documentElement.style.setProperty('--text-color', config.layout?.colors?.text || '#ffffff');
            document.documentElement.style.setProperty('--text-muted', config.layout?.colors?.textMuted || '#888888');
            document.documentElement.style.setProperty('--card-background', config.layout?.colors?.cardBackground || '#2a2a2a');

            // Set page metadata
            document.getElementById('page-title').textContent = config.name;
            document.getElementById('page-description').content = `${config.name} - ${config.tagline || 'Connect with us'}`;
            document.getElementById('theme-color').content = config.layout?.colors?.primary || '#FF6B35';
            document.getElementById('og-title').content = config.name;
            document.getElementById('og-description').content = config.tagline || 'Connect with us';
            if (config.layout?.image?.url) {
                document.getElementById('og-image').content = config.layout.image.url;
            }

            // Apply background based on type
            const bgType = config.layout?.background?.type || 'color';
            const bgValue = config.layout?.background?.value || '#1a1a1a';

            if (bgType === 'gradient') {
                document.body.style.background = bgValue;
            } else if (bgType === 'image' && bgValue) {
                const overlay = config.layout?.background?.overlay || 50;
                document.body.style.background = `linear-gradient(rgba(0,0,0,${overlay/100}), rgba(0,0,0,${overlay/100})), url(${bgValue}) center/cover no-repeat fixed`;
                document.body.classList.add('has-bg-image');
            } else {
                document.body.style.backgroundColor = bgValue;
            }

            if (config.layout?.theme === 'app') {
                renderAppTheme(config);
                return;
            }

            if (isCard) {
                // Card Layout
                document.body.classList.add('layout-card');
                document.getElementById('content-card').classList.remove('hidden');

                setHeroImage('card-hero-image', config);
                document.getElementById('card-restaurant-name').textContent = config.name;
                document.getElementById('card-tagline').textContent = config.tagline || '';
                document.getElementById('card-bio').textContent = config.bio || '';
                document.getElementById('card-location-text').textContent = config.location || '';
                document.getElementById('card-hours').textContent = config.hours || '';

                renderButtons(config.buttons || [], 'card-button-grid', config);
                renderSocial(config.social || {}, 'card-social-links');
            } else {
                // Minimal or Hero Layout
                document.body.className = `layout-${config.layout?.style || 'minimal'} spacing-${config.layout?.spacing || 'comfortable'}`;
                document.getElementById('content-default').classList.remove('hidden');

                // Hero background for hero layout
                if (config.layout?.style === 'hero' && config.layout?.image?.heroBackground) {
                    document.getElementById('hero').style.backgroundImage = `url(${config.layout.image.heroBackground})`;
                }

                setHeroImage('hero-image', config);
                document.getElementById('restaurant-name').textContent = config.name;
                document.getElementById('tagline').textContent = config.tagline || '';
                document.getElementById('bio').textContent = config.bio || '';
                document.getElementById('location-text').textContent = config.location || '';
                document.getElementById('hours').textContent = config.hours || '';

                renderButtons(config.buttons || [], 'button-grid', config);
                renderSocial(config.social || {}, 'social-links');
            }

            // Hide loading
            document.getElementById('loading').style.display = 'none';
        }

        function renderButtons(buttons, containerId, config) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const buttonStyle = config?.layout?.buttonStyle || 'filled';
            const buttonShape = config?.layout?.buttonShape || 'default';
            const buttonShadow = config?.layout?.buttonShadow || false;
            const entranceAnim = config?.layout?.animation?.entrance || 'none';
            const hoverAnim = config?.layout?.animation?.hover || 'none';
            const slug = config?.slug;

            buttons.forEach((button, index) => {
                const btn = document.createElement('a');
                btn.href = button.url;

                // Build class list
                const classes = ['btn', `btn-${buttonStyle}`, `btn-shape-${buttonShape}`];
                if (buttonShadow) classes.push('btn-shadow');
                if (entranceAnim !== 'none') classes.push(`anim-${entranceAnim}`);
                if (hoverAnim !== 'none') classes.push(`hover-${hoverAnim}`);
                btn.className = classes.join(' ');

                // Add animation delay for staggered entrance
                if (entranceAnim !== 'none') {
                    btn.style.animationDelay = `${index * 0.1}s`;
                }

                // Add emoji if present
                if (button.emoji) {
                    const emojiSpan = document.createElement('span');
                    emojiSpan.className = 'btn-emoji';
                    emojiSpan.textContent = button.emoji;
                    btn.appendChild(emojiSpan);
                }

                // Add text
                const textSpan = document.createElement('span');
                textSpan.textContent = button.text;
                btn.appendChild(textSpan);

                btn.target = '_blank';
                btn.rel = 'noopener';

                // Track clicks (cookie-free)
                btn.addEventListener('click', () => {
                    if (slug) trackClick(slug);
                });

                container.appendChild(btn);
            });
        }

        function renderSocial(social, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            Object.entries(social).forEach(([platform, url]) => {
                if (url && socialIcons[platform]) {
                    const link = document.createElement('a');
                    link.href = url;
                    link.className = 'social-link';
                    link.target = '_blank';
                    link.rel = 'noopener';
                    link.title = platform.charAt(0).toUpperCase() + platform.slice(1);
                    link.innerHTML = socialIcons[platform];
                    container.appendChild(link);
                }
            });
        }
