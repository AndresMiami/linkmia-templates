<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">LinkMia</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" id="theme-color" content="#FF6B35">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- SEO & Social -->
    <meta name="description" id="page-description" content="Connect with us">
    <meta property="og:title" id="og-title" content="LinkMia">
    <meta property="og:description" id="og-description" content="Connect with us">
    <meta property="og:image" id="og-image" content="">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #FF6B35;
            --secondary-color: #F7931E;
            --background-color: #1a1a1a;
            --card-background: #2a2a2a;
            --text-color: #ffffff;
            --text-muted: #888;
            --spacing: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
            opacity: 0;
            transition: opacity 0.3s;
        }

        body.has-bg-image::before {
            opacity: 1;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
        }

        /* LAYOUT: MINIMAL */
        .layout-minimal .hero {
            text-align: center;
            padding: 40px 0 32px;
        }

        .layout-minimal .hero-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 20px;
            border: 4px solid var(--primary-color);
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.3);
            display: block;
        }

        /* LAYOUT: HERO */
        .layout-hero {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .layout-hero .hero {
            position: relative;
            min-height: 40vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px 40px;
            background-size: cover;
            background-position: center;
        }

        .layout-hero .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.7));
            z-index: 0;
        }

        .layout-hero .hero > * {
            position: relative;
            z-index: 1;
        }

        .layout-hero .hero-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
            border: 4px solid white;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .layout-hero .container {
            flex: 1;
            padding-top: 0;
        }

        /* LAYOUT: CARD */
        .layout-card {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .layout-card .card-wrapper {
            background: var(--card-background);
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .layout-card .hero {
            text-align: center;
            padding-bottom: 24px;
        }

        .layout-card .hero-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 16px;
            border: 4px solid var(--primary-color);
        }

        /* Typography */
        .restaurant-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 12px;
        }

        .location {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .location svg {
            width: 16px;
            height: 16px;
        }

        /* Buttons */
        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-emoji {
            font-size: 1.1em;
        }

        /* Button Fill Styles */
        .btn-filled, .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-soft {
            background: rgba(255, 107, 53, 0.15);
            color: var(--primary-color);
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary {
            background: var(--card-background);
            color: var(--text-color);
            border: 1px solid #444;
        }

        /* Button Shapes */
        .btn-shape-square {
            border-radius: 0;
        }

        .btn-shape-default {
            border-radius: 12px;
        }

        .btn-shape-rounded {
            border-radius: 50px;
        }

        /* Button Shadow */
        .btn-shadow {
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        /* Hover states */
        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-filled:hover, .btn-primary:hover {
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.4);
        }

        .btn-outline:hover {
            background: var(--primary-color);
            color: white;
        }

        .btn-secondary:hover {
            border-color: var(--primary-color);
        }

        /* Spacing variants */
        .spacing-compact .button-grid { gap: 8px; }
        .spacing-compact .btn { padding: 12px 20px; }
        .spacing-spacious .button-grid { gap: 16px; }
        .spacing-spacious .btn { padding: 20px 28px; }

        /* Social Links */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .social-link {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-background);
            border-radius: 50%;
            color: var(--text-color);
            transition: all 0.2s;
        }

        .social-link:hover {
            background: var(--primary-color);
            transform: scale(1.1);
        }

        .social-icon {
            width: 20px;
            height: 20px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding-top: 16px;
            border-top: 1px solid #333;
        }

        .footer p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .powered-by a {
            color: var(--primary-color);
            text-decoration: none;
        }

        /* Loading */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--background-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-spinner {
            border: 3px solid #333;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Error State */
        .error-state {
            text-align: center;
            padding: 60px 20px;
        }

        .error-state h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .error-state p {
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .error-state a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <p>Loading...</p>
    </div>

    <div id="error-state" class="error-state hidden">
        <h1>Page Not Found</h1>
        <p>This link page doesn't exist or has been removed.</p>
        <a href="https://link.linkmia.com">Go to LinkMia</a>
    </div>

    <!-- Minimal & Hero Layout -->
    <div id="content-default" class="hidden">
        <div class="hero" id="hero">
            <img id="hero-image" class="hero-image" src="" alt="Logo">
            <h1 class="restaurant-name" id="restaurant-name"></h1>
            <p class="tagline" id="tagline"></p>
            <p class="location" id="location">
                <svg fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
                </svg>
                <span id="location-text"></span>
            </p>
        </div>

        <div class="container" id="container">
            <div class="button-grid" id="button-grid"></div>
            <div class="social-links" id="social-links"></div>
            <div class="footer">
                <p id="hours"></p>
                <p class="powered-by">Powered by <a href="https://linkmia.com" target="_blank">LinkMia</a></p>
            </div>
        </div>
    </div>

    <!-- Card Layout -->
    <div id="content-card" class="layout-card hidden">
        <div class="card-wrapper">
            <div class="hero">
                <img id="card-hero-image" class="hero-image" src="" alt="Logo">
                <h1 class="restaurant-name" id="card-restaurant-name"></h1>
                <p class="tagline" id="card-tagline"></p>
                <p class="location">
                    <svg fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/>
                    </svg>
                    <span id="card-location-text"></span>
                </p>
            </div>
            <div class="button-grid" id="card-button-grid"></div>
            <div class="social-links" id="card-social-links"></div>
            <div class="footer">
                <p id="card-hours"></p>
                <p class="powered-by">Powered by <a href="https://linkmia.com" target="_blank">LinkMia</a></p>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // ANALYTICS (Cookie-free tracking)
        // ============================================
        const ANALYTICS_KEY = 'linkmia_analytics';

        function trackPageView(slug) {
            try {
                let analytics = {};
                const stored = localStorage.getItem(ANALYTICS_KEY);
                if (stored) {
                    analytics = JSON.parse(stored);
                }

                if (!analytics[slug]) {
                    analytics[slug] = { views: 0, clicks: 0, lastVisit: null };
                }

                analytics[slug].views = (analytics[slug].views || 0) + 1;
                analytics[slug].lastVisit = new Date().toISOString();

                localStorage.setItem(ANALYTICS_KEY, JSON.stringify(analytics));
            } catch (e) {
                // Analytics tracking failed silently
            }
        }

        function trackClick(slug) {
            try {
                let analytics = {};
                const stored = localStorage.getItem(ANALYTICS_KEY);
                if (stored) {
                    analytics = JSON.parse(stored);
                }

                if (!analytics[slug]) {
                    analytics[slug] = { views: 0, clicks: 0, lastVisit: null };
                }

                analytics[slug].clicks = (analytics[slug].clicks || 0) + 1;

                localStorage.setItem(ANALYTICS_KEY, JSON.stringify(analytics));
            } catch (e) {
                // Analytics tracking failed silently
            }
        }

        // ============================================
        // GET SLUG FROM URL
        // ============================================
        function getSlugFromURL() {
            const path = window.location.pathname;
            // Handle /p/slug or /p/slug/
            const match = path.match(/\/p\/([^\/]+)/);
            return match ? match[1] : null;
        }

        // ============================================
        // RENDER PAGE
        // ============================================
        function renderPage(config) {
            const isCard = config.layout?.style === 'card';

            // Set CSS variables
            document.documentElement.style.setProperty('--primary-color', config.layout?.colors?.primary || '#FF6B35');
            document.documentElement.style.setProperty('--secondary-color', config.layout?.colors?.secondary || '#F7931E');
            document.documentElement.style.setProperty('--text-color', config.layout?.colors?.text || '#ffffff');
            document.documentElement.style.setProperty('--text-muted', config.layout?.colors?.textMuted || '#888888');
            document.documentElement.style.setProperty('--card-background', config.layout?.colors?.cardBackground || '#2a2a2a');

            // Set page metadata
            document.getElementById('page-title').textContent = config.name;
            document.getElementById('page-description').content = `${config.name} - ${config.tagline || 'Connect with us'}`;
            document.getElementById('theme-color').content = config.layout?.colors?.primary || '#FF6B35';
            document.getElementById('og-title').content = config.name;
            document.getElementById('og-description').content = config.tagline || 'Connect with us';
            if (config.layout?.image?.url) {
                document.getElementById('og-image').content = config.layout.image.url;
            }

            // Apply background
            if (config.layout?.background?.type === 'image') {
                document.body.style.backgroundImage = `url(${config.layout.background.value})`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundAttachment = 'fixed';
                document.body.classList.add('has-bg-image');
            } else {
                document.body.style.backgroundColor = config.layout?.background?.value || '#1a1a1a';
            }

            if (isCard) {
                // Card Layout
                document.body.classList.add('layout-card');
                document.getElementById('content-card').classList.remove('hidden');

                document.getElementById('card-hero-image').src = config.layout?.image?.url || '';
                document.getElementById('card-hero-image').alt = `${config.name} Logo`;
                document.getElementById('card-restaurant-name').textContent = config.name;
                document.getElementById('card-tagline').textContent = config.tagline || '';
                document.getElementById('card-location-text').textContent = config.location || '';
                document.getElementById('card-hours').textContent = config.hours || '';

                renderButtons(config.buttons || [], 'card-button-grid', config);
                renderSocial(config.social || {}, 'card-social-links');
            } else {
                // Minimal or Hero Layout
                document.body.className = `layout-${config.layout?.style || 'minimal'} spacing-${config.layout?.spacing || 'comfortable'}`;
                document.getElementById('content-default').classList.remove('hidden');

                // Hero background for hero layout
                if (config.layout?.style === 'hero' && config.layout?.image?.heroBackground) {
                    document.getElementById('hero').style.backgroundImage = `url(${config.layout.image.heroBackground})`;
                }

                document.getElementById('hero-image').src = config.layout?.image?.url || '';
                document.getElementById('hero-image').alt = `${config.name} Logo`;
                document.getElementById('restaurant-name').textContent = config.name;
                document.getElementById('tagline').textContent = config.tagline || '';
                document.getElementById('location-text').textContent = config.location || '';
                document.getElementById('hours').textContent = config.hours || '';

                renderButtons(config.buttons || [], 'button-grid', config);
                renderSocial(config.social || {}, 'social-links');
            }

            // Hide loading
            document.getElementById('loading').style.display = 'none';
        }

        function renderButtons(buttons, containerId, config) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const buttonStyle = config?.layout?.buttonStyle || 'filled';
            const buttonShape = config?.layout?.buttonShape || 'default';
            const buttonShadow = config?.layout?.buttonShadow || false;
            const slug = config?.slug;

            buttons.forEach(button => {
                const btn = document.createElement('a');
                btn.href = button.url;

                // Build class list
                const classes = ['btn', `btn-${buttonStyle}`, `btn-shape-${buttonShape}`];
                if (buttonShadow) classes.push('btn-shadow');
                btn.className = classes.join(' ');

                // Add emoji if present
                if (button.emoji) {
                    const emojiSpan = document.createElement('span');
                    emojiSpan.className = 'btn-emoji';
                    emojiSpan.textContent = button.emoji;
                    btn.appendChild(emojiSpan);
                }

                // Add text
                const textSpan = document.createElement('span');
                textSpan.textContent = button.text;
                btn.appendChild(textSpan);

                btn.target = '_blank';
                btn.rel = 'noopener';

                // Track clicks (cookie-free)
                btn.addEventListener('click', () => {
                    if (slug) trackClick(slug);
                });

                container.appendChild(btn);
            });
        }

        function renderSocial(social, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            Object.entries(social).forEach(([platform, url]) => {
                if (url && socialIcons[platform]) {
                    const link = document.createElement('a');
                    link.href = url;
                    link.className = 'social-link';
                    link.target = '_blank';
                    link.rel = 'noopener';
                    link.title = platform.charAt(0).toUpperCase() + platform.slice(1);
                    link.innerHTML = socialIcons[platform];
                    container.appendChild(link);
                }
            });
        }

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-state').classList.remove('hidden');
        }

        // ============================================
        // LOAD DATA
        // ============================================
        async function init() {
            const slug = getSlugFromURL();

            if (!slug) {
                showError();
                return;
            }

            try {
                // Fetch pages.json
                const response = await fetch('/data/pages.json?t=' + Date.now());
                if (!response.ok) throw new Error('Failed to load data');

                const data = await response.json();
                const page = data.pages.find(p => p.slug === slug && p.isActive !== false);

                if (!page) {
                    showError();
                    return;
                }

                // Track page view (cookie-free)
                trackPageView(slug);

                renderPage(page);

            } catch (error) {
                console.error('Error loading page:', error);
                showError();
            }
        }

        // Start
        init();
    </script>
</body>
</html>
