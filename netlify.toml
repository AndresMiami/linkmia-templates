# Netlify configuration for LinkMia Templates

[build]
  publish = "."
  # Checks the pages before every deploy and stamps /version.json with the
  # commit being deployed. If the check fails, the build fails and Netlify
  # keeps the last good deploy live. See scripts/predeploy-check.js.
  command = "node scripts/predeploy-check.js"

# Redirects for dynamic pages
# /p/anything -> /p/index.html (SPA style routing)
[[redirects]]
  from = "/p/*"
  to = "/p/index.html"
  status = 200

# Short link redirects
# /s/code -> /s/index.html (handles short link redirects)
[[redirects]]
  from = "/s/*"
  to = "/s/index.html"
  status = 200

# Clean public URL for the Best National demo (rewrite, not redirect:
# the address bar keeps /bnseguros). /demos/bnseguros.html keeps working.
[[redirects]]
  from = "/bnseguros"
  to = "/demos/bnseguros.html"
  status = 200

[[redirects]]
  from = "/bnseguros/"
  to = "/demos/bnseguros.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=60"

# Which commit is live: never cache, so it always tells the truth.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

# Client redesign concepts: shareable by link, but kept out of search results
# so they never compete with the client's real site.
[[headers]]
  for = "/concepts/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
