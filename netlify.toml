# Netlify configuration for LinkMia Templates

[build]
  publish = "."

# Redirects for dynamic pages
# /p/anything -> /p/index.html (SPA style routing)
[[redirects]]
  from = "/p/*"
  to = "/p/index.html"
  status = 200

# Short link redirects
# /s/code -> /s/index.html (handles short link redirects)
[[redirects]]
  from = "/s/*"
  to = "/s/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=60"
