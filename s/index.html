<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... | LinkMia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid #FF6B35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 400;
            margin-bottom: 10px;
        }

        p {
            color: #888;
            font-size: 0.9rem;
        }

        .error {
            display: none;
        }

        .error h1 {
            color: #ef4444;
        }

        .error a {
            color: #FF6B35;
            text-decoration: none;
        }

        .error a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="loading">
            <div class="spinner"></div>
            <h1>Redirecting...</h1>
            <p>Please wait a moment</p>
        </div>
        <div id="error" class="error">
            <h1>Link Not Found</h1>
            <p>This short link doesn't exist or has expired.</p>
            <p style="margin-top: 20px;"><a href="https://link.linkmia.com">Go to LinkMia</a></p>
        </div>
    </div>

    <script>
        const ANALYTICS_KEY = 'linkmia_analytics';

        // Get short code from URL
        function getShortCode() {
            const path = window.location.pathname;
            const match = path.match(/\/s\/([^\/]+)/);
            return match ? match[1] : null;
        }

        // Track click and redirect
        async function redirect() {
            const shortCode = getShortCode();

            if (!shortCode) {
                showError();
                return;
            }

            try {
                // Fetch pages data
                const response = await fetch('/data/pages.json?t=' + Date.now());
                if (!response.ok) throw new Error('Failed to load');

                const data = await response.json();

                // Find page by short code
                const page = data.pages.find(p => p.shortCode === shortCode && p.isActive !== false);

                if (!page) {
                    showError();
                    return;
                }

                // Track the click (cookie-free using localStorage)
                trackClick(page.slug);

                // Redirect to the full page URL
                window.location.href = `https://link.linkmia.com/p/${page.slug}`;

            } catch (error) {
                console.error('Redirect error:', error);
                showError();
            }
        }

        function trackClick(slug) {
            try {
                let analytics = {};
                const stored = localStorage.getItem(ANALYTICS_KEY);
                if (stored) {
                    analytics = JSON.parse(stored);
                }

                if (!analytics[slug]) {
                    analytics[slug] = { views: 0, clicks: 0, lastVisit: null };
                }

                // Increment view count for short link usage
                analytics[slug].views = (analytics[slug].views || 0) + 1;
                analytics[slug].lastVisit = new Date().toISOString();

                localStorage.setItem(ANALYTICS_KEY, JSON.stringify(analytics));
            } catch (e) {
                // Analytics tracking failed, continue anyway
            }
        }

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        }

        // Start redirect
        redirect();
    </script>
</body>
</html>
